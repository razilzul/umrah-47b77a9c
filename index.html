<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f3d34">
<title>Umrah Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Umrah">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: phone-first, one step at a time. Bottom tabs, sticky sub-tabs, big readable cards, counters for tawaf and sa'i. */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --fg:#1d2330; --muted:#5d6574; --line:#e2e0d8;
  --accent:#8a6a2a; --accent-soft:#f3ead6; --deep:#1f3b4d; --ok:#2f6b4f; --rain:#2b6cb0;
  --ar:"Amiri","Traditional Arabic",serif; --body:"Inter",system-ui,sans-serif; --display:"Fraunces",Georgia,serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1b212b; --fg:#ece9e1; --muted:#a3a9b4; --line:#2c3440;
  --accent:#d9b56a; --accent-soft:#2e2a1f; --deep:#9fc3d8; --ok:#7cc7a0; --rain:#8cc0f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1b212b; --fg:#ece9e1; --muted:#a3a9b4; --line:#2c3440;
  --accent:#d9b56a; --accent-soft:#2e2a1f; --deep:#9fc3d8; --ok:#7cc7a0; --rain:#8cc0f0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:calc(16px*var(--scale));line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{font-family:var(--display);font-size:1.7em;margin:0;color:var(--deep);text-wrap:balance;line-height:1.2}
header p{margin:4px 0 0;color:var(--muted);font-size:.9em}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}
.hdr-act{flex:none;display:flex;gap:8px;align-items:center}
.lang{display:flex;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.lang button{min-width:40px;border:0;background:transparent;color:var(--muted);border-radius:9px;font:600 .85em var(--body);letter-spacing:.04em;cursor:pointer;padding:0 8px}
.lang button[aria-pressed="true"]{background:var(--deep);color:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-top:12px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:9px 4px;font:500 .85em var(--body);line-height:1.15;cursor:pointer;overflow-wrap:anywhere}
.seg button[aria-selected="true"]{background:var(--deep);color:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px))}
.nav .in{display:flex;max-width:640px;margin:0 auto}
.nav button{flex:1;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:6px 0 4px;font:500 12px var(--body);cursor:pointer;min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--deep);font-weight:600}
.nav button[aria-current="page"] svg{stroke-width:2.2}
section{display:grid;gap:14px;margin-top:14px}
.lead{color:var(--muted);margin:0}
.step{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;min-width:0}
.card h3{margin:0;font-size:1em}
.ar{font-family:var(--ar);font-size:1.75em;line-height:1.9;direction:rtl;text-align:right;margin:0;white-space:pre-line}
.dh{border-top:1px solid var(--line);padding-top:6px;display:grid;gap:4px}
.kaaba{width:100%;max-width:420px;justify-self:center;font:500 11px var(--body)}
.tr{font-style:italic;margin:0;white-space:pre-line}
.en{color:var(--muted);margin:0;font-size:.95em;white-space:pre-line}
.note{font-size:.85em;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin:0}
.hide-ar .ar,.hide-tr .tr,.hide-en .en{display:none}
.hide-tr .tr.ins,.hide-en .en.ins{display:block}
.hide-ar.hide-tr.hide-en .dh{display:none}
.counter{text-align:center;display:grid;gap:10px}
.counter .big{font-family:var(--display);font-size:3.2em;line-height:1;color:var(--deep);font-variant-numeric:tabular-nums}
.counter .where{font-weight:600;color:var(--accent)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.tap{border:0;background:var(--deep);color:var(--bg);font:600 1.1em var(--body);border-radius:14px;padding:22px;cursor:pointer}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.row button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:8px 14px;font:inherit;font-size:.85em;cursor:pointer}
.row button.danger{border-color:#c0392b;color:#c0392b}
.awake{justify-self:center;display:inline-flex;align-items:center;gap:6px;font-size:.75em;color:var(--ok);border:1px solid currentColor;border-radius:999px;padding:2px 10px}
.awake svg{width:14px;height:14px}
.day{display:grid;grid-template-columns:4.5em 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day b{font-variant-numeric:tabular-nums}
.day.now{background:var(--accent-soft);border-radius:10px;padding:10px;border:0}
.day p{margin:0}.day>div{min-width:0}
textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;padding:12px}
.bd{font:600 .68em var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.bd.rukun{color:#c0392b}.bd.wajib{color:#b86e00}.bd.sunnah{color:var(--ok)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.focus{text-align:left;display:grid;gap:6px;background:var(--accent-soft);border-radius:12px;padding:12px}
.plink{unicode-bidi:isolate;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.own{margin:0;font-size:.95em;line-height:1.65}
.edbox{width:100%;min-height:240px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;padding:10px}
.names{display:grid;gap:8px}.names label{display:grid;gap:4px;font-size:.85em;color:var(--muted)}.names input{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;padding:10px}
ol.steps{margin:0;padding-left:1.2em;display:grid;gap:4px}
/* checklists */
.cks{display:grid;gap:2px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;line-height:1.45}
.ck input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--ok);cursor:pointer}
.ck.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.linkbtn{justify-self:start;border:0;background:none;color:var(--accent);font:inherit;font-size:.85em;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* weather */
.ic{width:1.2em;height:1.2em;flex:none;vertical-align:-.22em}
.wxnow{display:flex;align-items:center;gap:12px}
.wxnow .ic{width:52px;height:52px}
.wxnow .t{font-family:var(--display);font-size:2.8em;line-height:1;color:var(--deep);font-variant-numeric:tabular-nums}
.wxm{display:grid;gap:1px;font-size:.88em;color:var(--muted);min-width:0}
.wxm b{color:var(--fg);font-weight:600;font-size:1.05em}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:.78em}
.hours div{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:8px;color:var(--muted)}
.hours div b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.hours .ic{width:22px;height:22px}
.hours .hot{background:var(--accent-soft)}
.hours .cur{outline:1.5px solid var(--deep)}
.hints{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.9em}
.upd{margin:0;font-size:.75em;color:var(--muted)}
.chip{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.8em;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.chip .ic{width:18px;height:18px}
.rain{color:var(--rain);font-weight:500}
.pt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pt div{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;display:grid;gap:0}
.pt span{font-size:.75em;color:var(--muted)}
.pt b{font-variant-numeric:tabular-nums;font-weight:600}
.pt .nx{background:var(--deep);border-color:var(--deep)}.pt .nx span,.pt .nx b{color:var(--bg)}
.pt .past{opacity:.55}
.next p{margin:0}
.cd{font-size:.85em;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* crowds */
.snap{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9}
.snap img,.snap iframe{position:absolute;inset:0;width:100%;height:100%;display:block;border:0;object-fit:cover}
.snap .msg{position:absolute;inset:0;display:grid;place-items:center;color:#ece9e1;font-size:.9em;padding:16px;text-align:center}
.dpills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.dpills button{flex:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 12px;font:500 .82em var(--body);cursor:pointer;white-space:nowrap}
.dpills button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--bg)}
.bars{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:120px;margin-top:6px}
.bars button{border:0;padding:0;background:none;height:100%;display:flex;align-items:flex-end;cursor:pointer;min-width:0}
.bars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--muted);opacity:.55}
.bars .q i{background:var(--ok);opacity:.9}
.bars .cur i{opacity:1;box-shadow:inset 0 0 0 2px var(--deep)}
.bars .sel i{opacity:1;background:var(--accent)}
.axis{display:grid;grid-template-columns:repeat(4,1fr);font-size:.72em;color:var(--muted);font-variant-numeric:tabular-nums}
/* settings sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;background:var(--surface);color:var(--fg);border-radius:18px 18px 0 0;padding:6px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;max-height:88vh;overflow:auto;font-size:16px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 0}
.sheet h2{margin:0;font:600 1.1em var(--body)}
.opt{display:grid;gap:8px}
.opt>.lbl{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.pills{display:flex;gap:6px}
.pills button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:10px 6px;font:500 .9em var(--body);cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--bg)}
.swrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.switch{position:relative;width:48px;height:28px;border-radius:14px;border:0;background:var(--line);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.size{display:flex;align-items:center;gap:8px}
.size button{width:52px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:10px 0;font:600 .95em var(--body);cursor:pointer}
.size output{flex:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.done{border:0;background:var(--deep);color:var(--bg);border-radius:12px;padding:14px;font:600 1em var(--body);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tap:active{transform:scale(.98)}}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}

html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}
</style>
</head><body>

<div class="wrap">
<header class="top">
  <div>
    <h1 data-t="Umrah Companion">Umrah Companion</h1>
    <p data-t="24 Nov – 6 Dec 2026 · Makkah · Taif · Madinah">24 Nov – 6 Dec 2026 · Makkah · Taif · Madinah</p>
  </div>
  <div class="hdr-act"><div class="lang" id="langs" role="group" aria-label="Language"><button data-lang="en" aria-pressed="false" aria-label="English" lang="en">EN</button><button data-lang="ms" aria-pressed="false" aria-label="Bahasa Melayu" lang="ms">BM</button></div>
  <button class="icon-btn" id="gear" aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</header>

<div class="bar" id="bar"><div class="seg" role="tablist" id="seg"></div></div>

<main id="main"></main>
<p class="en" style="margin-top:28px;font-size:.8em" data-t="Check the wording with your mutawwif or ustaz if you're unsure. In tawaf and sa'i you can make any dua, in any language.">Check the wording with your mutawwif or ustaz if you're unsure. In tawaf and sa'i you can make any dua, in any language.</p>
</div>

<nav class="nav" aria-label="Sections"><div class="in" id="nav"></div></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" hidden>
  <div class="grab"></div>
  <h2 id="sheet-h" data-t="Settings">Settings</h2>
  <div class="opt"><span class="lbl" data-t="Show">Show</span>
    <div class="swrow"><span data-t="Arabic">Arabic</span><button class="switch" role="switch" data-show="ar" aria-checked="true" aria-label="Arabic"></button></div>
    <div class="swrow"><span data-t="Transliteration">Transliteration</span><button class="switch" role="switch" data-show="tr" aria-checked="true" aria-label="Transliteration"></button></div>
    <div class="swrow"><span data-t="Meaning">Meaning</span><button class="switch" role="switch" data-show="en" aria-checked="true" aria-label="Meaning"></button></div></div>
  <div class="opt"><span class="lbl" data-t="Text size">Text size</span>
    <div class="size"><button id="t-minus" aria-label="Smaller text">A−</button><output id="t-size">100%</output><button id="t-plus" aria-label="Larger text">A+</button></div></div>
  <div class="opt"><span class="lbl" data-t="Theme">Theme</span>
    <div class="pills" id="themes"><button data-theme-set="auto" data-t="Auto">Auto</button><button data-theme-set="light" data-t="Light">Light</button><button data-theme-set="dark" data-t="Dark">Dark</button></div></div>
  <button class="done" id="done" data-t="Done">Done</button>
</div>

<script>
const D=(ar,tr,en,note,h)=>({ar,tr,en,note,h});
const KAABA=()=>`<svg class="kaaba" viewBox="0 0 400 400" role="img" aria-label="${esc(t("Tawaf path around the Kaaba, seen from above: start at the Black Stone line and walk anticlockwise with the Kaaba on your left, outside Hijr Ismail"))}">
<defs><marker id="kah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>
<path d="M266.9 299.8 A135 150 0 0 0 275.5 84" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#kah)"/>
<path d="M275.5 84 A135 150 0 0 0 84.5 84" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#kah)"/>
<path d="M84.5 84 A135 150 0 0 0 84.5 296" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#kah)"/>
<path d="M84.5 296 A135 150 0 0 0 266.9 299.8" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="butt" opacity=".85"/>
<path d="M84.5 296 A135 150 0 0 0 266.9 299.8" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#kah)"/>
<path d="M142 150 A40 48 0 0 1 218 150" fill="none" stroke="var(--muted)" stroke-width="3"/>
<text x="180" y="144" text-anchor="middle" fill="var(--fg)" font-size="10">${esc(t("Hijr Ismail"))}</text>
<rect x="130" y="155" width="100" height="100" fill="#1a1a1a" stroke="var(--muted)" rx="2"/>
<text x="180" y="210" text-anchor="middle" fill="#ece9e1" font-weight="600" font-size="12">${esc(t("Kaaba"))}</text>
<rect x="226" y="180" width="7" height="26" fill="#d9b56a"/>
<line x1="229.5" y1="210" x2="229.5" y2="250" stroke="#c0392b" stroke-width="4"/>
<text x="222" y="196" text-anchor="end" fill="#ece9e1" font-size="10">${esc(t("Door"))}</text>
<text x="222" y="234" text-anchor="end" fill="#ece9e1" font-size="10">${esc(t("Multazam"))}</text>
<line x1="230" y1="255" x2="300" y2="340" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 3"/>
<circle cx="230" cy="255" r="7" fill="#c0392b"/>
<text x="290" y="352" fill="var(--fg)" font-weight="600">${esc(t("Start and end"))}</text>
<text x="290" y="366" fill="var(--muted)" font-size="10">${esc(t("Black Stone line"))}</text>
<text x="290" y="378" fill="var(--muted)" font-size="10">${esc(t("(green light)"))}</text>
<text x="242" y="264" fill="var(--fg)" font-size="10">${esc(t("Black Stone"))}</text>
<circle cx="130" cy="255" r="5" fill="var(--ok)"/>
<text x="130" y="274" text-anchor="middle" fill="var(--fg)" font-size="10">${esc(t("Yemeni Corner"))}</text>
<text x="124" y="152" text-anchor="end" fill="var(--fg)" font-size="10">${esc(t("Shami Corner"))}</text>
<text x="236" y="152" fill="var(--fg)" font-size="10">${esc(t("Iraqi Corner"))}</text>
<rect x="266" y="176" width="16" height="16" rx="3" fill="none" stroke="var(--accent)" stroke-width="2"/>

const SECTIONS=[
 {id:"today",label:"Itinerary",render:renderToday},
 {id:"ihram",label:"1 · Ihram",lead:"Change at Dubai (4:10–6:00 am, 25 Nov). Intend Umrah on the Dubai–Jeddah flight before the miqat. Second Umrah (27 Nov): go to Masjid Aisyah at Tan'im, outside the Haram boundary, and start ihram there.",items:[
  D("","Ghusl, or at least wudu (Sunnah)\nClip nails and trim before you start; you can wear perfume on your body before the intention (Sunnah)\nIhram clothes. Men: two wraps, head uncovered, no fitted clothes (shirts, trousers, underwear); stitched hems and belts are fine. Women: normal modest clothes, no niqab resting on the face, no gloves (Wajib)\nPray 2 rakaat sunnah ihram (Sunnah)","","","Before ihram"),
  D("","Men: no clothes cut to the body's shape (shirts, trousers, underwear, socks) and nothing covering the head\nWomen: nothing covering the face, no gloves\nNo perfume on the body or clothes, including scented soap, wipes and lotion\nNo oil or cream on the hair of the head or the beard (Shafi'i)\nNo removing hair or cutting nails on purpose\nNo intimacy or touching with desire. Deliberate intercourse before cutting the hair invalidates the Umrah: you stay in ihram, still finish it and make it up later, and an expiation may be due. Tell your mutawwif at once\nNo marriage contract, for yourself or for others (it would be invalid)\nNo hunting wild land game\nNo arguing or bad language\nAnywhere in Makkah's Haram, ihram or not: no hunting, and no cutting or uprooting wild plants and trees","","From the intention until you cut your hair. Cutting hair or nails needs a fidyah even if done by mistake; perfume or clothing by mistake does not. Ask your mutawwif before paying anything.","Ihram rules"),
  D("","Menstruation or postnatal bleeding: enter ihram at the miqat as usual. Wait until bleeding ends and do ghusl before tawaf. If bleeding starts after tawaf, you can still do sa'i and cut your hair. If departure is close and tawaf isn't done, tell the mutawwif at once.","","","For women"),
  D("سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ","Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina lamunqalibun","Glory to the One who made this subservient to us. We could not have done it ourselves, and to our Lord we will return.","Dua for travelling: say it when the plane, van or train moves off.","Travel"),
  D("لَبَّيْكَ اللَّهُمَّ عُمْرَةً","Labbaik Allahumma 'umratan","Here I am, O Allah, for Umrah.","The intention in your heart is what counts, made before the miqat. Say these words once as you intend (sunnah), then switch to the full talbiyah below. If unsure of the timing, intend early.","Niyyah"),
  D("اللَّهُمَّ مَحِلِّي حَيْثُ حَبَسْتَنِي","Allahumma mahilli haythu habastani","O Allah, I leave ihram wherever You hold me back.","Add it to your intention if you fear illness or another problem may stop you finishing. If it does stop you, you can leave ihram without a dam by intending to and cutting your hair (Bukhari, Muslim). Ask your mutawwif.","Conditional intention"),
  D("لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ","Labbaik Allahumma labbaik, labbaika la sharika laka labbaik, innal-hamda wan-ni'mata laka wal-mulk, la sharika lak","Here I am, O Allah, here I am. You have no partner. All praise, blessings and dominion are Yours. You have no partner.","Say it often (men aloud, women softly) until you begin tawaf.","Talbiyah")]},
 {id:"tawaf",label:"2 · Tawaf",lead:"7 rounds, anticlockwise, Kaaba on your left. Reset the counter before each Umrah.",counter:{max:7,name:"Round",go:"2 rakaat sunnah after tawaf · Maqam Ibrahim",goLabel:"Next: 2 rakaat where there's space",focus:[{"t": "Forgiveness and thanks", "ar": "رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", "tr": "Rabbana zalamna anfusana wa in lam taghfir lana wa tarhamna lanakunanna minal-khasirin", "en": "Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we will surely be among the losers. (Al-A'raf 7:23)", "dh": {"ar": "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ", "tr": "Astaghfirullahal-'azim alladhi la ilaha illa huwal-Hayyul-Qayyum wa atubu ilaih", "en": "I ask forgiveness of Allah the Almighty, besides whom there is no god, the Ever-Living, the Sustainer of all, and I turn to Him in repentance."}, "own": "O Allah, all praise is Yours for bringing me to Your House, when so many wish to come and cannot. You chose me for this, and I am not worthy of it. O Allah, I have wronged myself many times. Forgive all my sins, the big and the small, the old and the new, the ones I remember and the ones I've forgotten, the ones done in public and the ones done in private. Forgive the prayers I delayed, the words that hurt people, the time I wasted and the blessings I didn't thank You for. O Allah, clean my heart from pride, envy and showing off. Let me leave this place as pure as the day I was born, and help me stay that way when I go home."}, {"t": "Your parents", "ar": "رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "tr": "Rabbighfirli waliwalidayya warhamhuma kamaa rabbayani saghira", "en": "My Lord, forgive me and my parents, and have mercy on them as they raised me when I was small. (Based on Al-Isra' 17:24)", "dh": {"ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "tr": "La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir", "en": "There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over all things."}, "own": "O Allah, forgive {parents} and have mercy on them, as they raised me when I was small. They stayed up for me, fed me, taught me and prayed for me before I could pray for myself. Reward them for every sacrifice, every tear and every worry they carried for me. O Allah, give them good health, a long life in obedience to You, and hearts full of peace. Make their old age easy, protect them from needing anyone but You, and give them a peaceful ending with La ilaha illallah on their tongues. Forgive me for every time I was impatient with them or hurt them. Make me a child who brings them joy in this life and is a sadaqah jariyah for them after. And gather us all together in Jannatul Firdaus."}, {"t": "Spouse and children", "ar": "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", "tr": "Rabbana hab lana min azwajina wa dhurriyyatina qurrata a'yunin waj'alna lil-muttaqina imama", "en": "Our Lord, grant us spouses and children who are the coolness of our eyes, and make us leaders of the righteous. (Al-Furqan 25:74)", "dh": {"ar": "وَإِلَهُكُمْ إِلَهٌ وَاحِدٌ لَا إِلَهَ إِلَّا هُوَ الرَّحْمَنُ الرَّحِيمُ", "tr": "Wa ilahukum ilahun wahid, la ilaha illa huwar-Rahmanur-Rahim", "en": "Your God is one God. There is no god but Him, the Most Compassionate, the Most Merciful. (Al-Baqarah 2:163)"}, "own": "O Allah, bless {family}. Make them the coolness of my eyes, and make me the coolness of theirs. Keep them safe wherever they are, healthy in body and mind, and close to You. O Allah, put love, mercy and patience in our home. Protect us from arguments, from jealousy and from anything that divides us. Make me a good spouse who is gentle and fair, and a parent who teaches by example. Guide our children to love You, Your Prophet ﷺ and the Quran. Make our home a place where Your name is remembered often. And let our family be together in Jannah, just as we are together here."}, {"t": "Health, rizq and work", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ", "tr": "Allahumma inni as'alukal-'afwa wal-'afiyata fid-dunya wal-akhirah. Allahummak-fini bihalalika 'an haramika wa aghnini bifadlika 'amman siwak", "en": "O Allah, I ask You for pardon and well-being in this world and the next. O Allah, suffice me with what is halal instead of what is haram, and make me independent of all but You. (Abu Dawud, Tirmidhi)", "dh": {"ar": "حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", "tr": "Hasbiyallahu la ilaha illa huwa, 'alaihi tawakkaltu wa huwa Rabbul-'arshil-'azim", "en": "Allah is enough for me. There is no god but Him. In Him I put my trust, and He is the Lord of the Mighty Throne. (At-Tawbah 9:129)"}, "own": "O Allah, I ask You for pardon and well-being in my religion, my life, my family and my wealth. Give me and my family good health in body and mind, and protect us from serious illness and from being a burden on others. Cure those of us who are already sick. O Allah, give us rizq that is halal, plentiful and full of barakah. Bless my work: give me skill, honesty and good colleagues, open good doors for me and close the harmful ones. Free us from debt and from need of anyone but You. Make what You give us a means to do good, and don't let wealth distract us from You."}, {"t": "People who asked you to pray", "ar": "اللَّهُمَّ اقْضِ حَوَائِجَهُمْ وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ", "tr": "Allahummaq-di hawa'ijahum, waghfir lahum warhamhum", "en": "O Allah, fulfil their needs, forgive them and have mercy on them.", "dh": {"ar": "سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ", "tr": "Subhanallah, walhamdulillah, wa la ilaha illallah, wallahu akbar", "en": "Glory be to Allah, praise be to Allah, there is no god but Allah, and Allah is the Greatest."}, "own": "O Allah, many people asked me to pray for them here: {asked}. You know each of their names and what is in their hearts better than I do. Please fulfil their requests in the way that is best for them. Cure those who are sick and ease their pain. Give children to those who long for them, spouses to those who are alone, and work to those who are looking. Settle the debts of those who are in debt, and ease the worries of those who are anxious. Guide those who are lost and bring them back to You. Accept their duas as You accept mine, bless their families, and reward them for trusting me with their hopes."}, {"t": "Those who passed away, and the Ummah", "ar": "رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَحِيمٌ", "tr": "Rabbanagh-fir lana wa li-ikhwaninal-ladhina sabaquna bil-iman, wa la taj'al fi qulubina ghillal-lilladhina amanu, Rabbana innaka Ra'ufur-Rahim", "en": "Our Lord, forgive us and our brothers who came before us in faith, and leave no ill will in our hearts towards the believers. Our Lord, You are Kind and Merciful. (Al-Hashr 59:10)", "dh": {"ar": "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ", "tr": "La hawla wa la quwwata illa billahil-'aliyyil-'azim", "en": "There is no power and no strength except with Allah, the Most High, the Almighty."}, "own": "O Allah, forgive {departed}. Have mercy on them, make their graves wide and full of light, and protect them from the punishment of the grave. Wash their sins away with water, snow and hail, and raise them among the people of Jannah. Let our duas and our good deeds reach them. O Allah, help the people of Gaza and every Muslim who is oppressed, hungry, sick, homeless or afraid. Give them safety, food, healing and victory. Unite the hearts of this Ummah, remove the hatred between us, and make us a source of mercy to the world. Forgive every Muslim, living and dead."}, {"t": "A good ending and Jannah", "ar": "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ", "tr": "Ya Muqallibal-qulub, thabbit qalbi 'ala dinik. Allahumma inni as'alukal-jannata wa a'udhu bika minan-nar", "en": "O Turner of hearts, keep my heart firm on Your religion. O Allah, I ask You for Jannah and seek refuge in You from the Fire. (Tirmidhi, Abu Dawud)", "dh": {"ar": "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", "tr": "Rabbana atina fid-dunya hasanah, wa fil-akhirati hasanah, wa qina 'adhaban-nar", "en": "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire."}, "own": "O Allah, I ask You for a good ending. Let my last words be La ilaha illallah, and let me die while You are pleased with me. Make the grave easy for me and my family: a garden from the gardens of Jannah, not a pit of the Fire. Make the reckoning light, give us our book in our right hands, make our scales heavy, and let us cross the Sirat like lightning. O Allah, grant us Jannatul Firdaus together, without reckoning and without punishment, and let us see Your Face. Whatever is left on my list, You know it already: grant it, O Most Generous, O Most Merciful."}],where:n=>n>=7?"Tawaf done.":"Count a round each time you reach the Black Stone line"},items:[
  {h:"Where to walk",html:KAABA},
  D("","Wudu, and free of major impurity\nAwrah covered as for prayer; women cover hair and feet\nBody and clothes clean of najasah\nStop the talbiyah (Sunnah)\nMen: uncover the right shoulder (Sunnah)\nStart just before the Black Stone line (green light) so your whole body passes it\nWalk outside the curved wall of Hijr Ismail, not through it","","","Before you start tawaf"),
  D("","Men: walk briskly in rounds 1–3 if there's space (Sunnah)\nRaise your right hand to the Black Stone each round. Don't push to kiss it (Sunnah)\nWudu breaks? Renew it and resume where you stopped. Unsure where? Restart that round at the Black Stone line. Completed rounds still count\nSkin contact with your spouse or an unrelated adult of the opposite sex breaks wudu (Shafi'i). Through clothing, or just doubt, does not\nUnsure of the count? Take the lower number","","","During tawaf"),
  D("بِسْمِ اللَّهِ وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","Bismillah, was-salatu was-salamu 'ala Rasulillah. Allahummaftah li abwaba rahmatik","In the name of Allah, peace and blessings on the Messenger of Allah. O Allah, open for me the doors of Your mercy.","Enter with your right foot.","Entering the Masjid"),
  D("اللَّهُمَّ زِدْ هَذَا الْبَيْتَ تَشْرِيفًا وَتَعْظِيمًا وَتَكْرِيمًا وَمَهَابَةً، وَزِدْ مَنْ شَرَّفَهُ وَكَرَّمَهُ مِمَّنْ حَجَّهُ أَوِ اعْتَمَرَهُ تَشْرِيفًا وَتَكْرِيمًا وَتَعْظِيمًا وَبِرًّا. اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، فَحَيِّنَا رَبَّنَا بِالسَّلَامِ","Allahumma zid hadhal-baita tashrifan wa ta'ziman wa takriman wa mahabah, wa zid man sharrafahu wa karramahu mimman hajjahu awi'tamarahu tashrifan wa takriman wa ta'ziman wa birra. Allahumma antas-salam wa minkas-salam, fa hayyina Rabbana bis-salam","O Allah, increase this House in honour, greatness, dignity and awe, and increase those who honour it, among those who come for Hajj or Umrah, in honour, dignity, greatness and goodness. O Allah, You are Peace and from You comes peace, so greet us, our Lord, with peace.","Optional. Reported from early scholars (the second part from Umar), not a fixed sunnah wording. Raise your hands, then make your most important dua in your own words. Keep the walkway clear.","First sight of the Kaaba"),
  D("","No set words for each round or length.","Make dua in Malay, English or any language. Quran, dhikr, salawat and calling Allah by His names (Ya Rahman, Ya Ghafur) are all good.","Keep your voice low. Avoid singing nasheeds or loud group chanting.","What to say in tawaf and sa'i"),
  D("بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ","Bismillahi wallahu akbar","In the name of Allah, and Allah is the Greatest.","Face the Black Stone and raise your right hand towards it at the start of every round.","Each round"),
  D("رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","Rabbana atina fid-dunya hasanah, wa fil-akhirati hasanah, wa qina 'adhaban-nar","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","Between the Yemeni Corner and the Black Stone.","Yemeni Corner → Black Stone"),
  D("وَاتَّخِذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى","Wattakhidhu min maqami Ibrahima musalla","Take the station of Ibrahim as a place of prayer.","Men: cover both shoulders first. Recite this Quran verse (Al-Baqarah 2:125) as the Prophet ﷺ did; it is a verse, not a dua. Then pray 2 rakaat behind the Maqam, or wherever there's space: Al-Kafirun in the 1st, Al-Ikhlas in the 2nd.","2 rakaat sunnah after tawaf · Maqam Ibrahim"),
  D("اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا وَاسِعًا، وَشِفَاءً مِنْ كُلِّ دَاءٍ","Allahumma inni as'aluka 'ilman nafi'an, wa rizqan wasi'an, wa shifa'an min kulli da'","O Allah, I ask You for useful knowledge, plentiful provision and a cure for every illness.","Face the Kaaba, say Bismillah and drink in 3 breaths, breathing outside the cup. Drink your fill and say Alhamdulillah. This dua is reported from Ibn Abbas; ask for anything you need.","Zamzam"),
  D("","The wall between the Black Stone and the Kaaba door, about 2 metres wide.","Some companions pressed their chest, cheek and arms to it and made dua. There are no set words: ask for what matters most to you.","In ihram, don't touch it: the cloth is perfumed. Make dua facing it instead. It's usually packed, so don't push; you can make the same dua from anywhere.","Multazam")]},
 {id:"sai",label:"3 · Sa'i",lead:"7 lengths: Safa → Marwah is 1, Marwah → Safa is 2. You finish at Marwah.",counter:{max:7,name:"Length",go:"Finish: cut the hair",goLabel:"Next: cut the hair",focus:[{"t": "Trust in Allah, like Hajar", "ar": "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", "tr": "Hasbunallahu wa ni'mal-wakil", "en": "Allah is enough for us, and He is the best to rely on. (Al 'Imran 3:173)", "own": "O Allah, Hajar was left in this empty valley with a baby and no water. She said You would not abandon her, and she ran between these hills trusting You. You answered her with Zamzam, which still flows today. O Allah, I put my trust in You the same way. You know my worries better than I do: my family, my work, my health and my future. Take the weight of them from my chest. Replace my fear with calm and my anxiety with certainty. Make me content with whatever You decide, and show me the good in it."}, {"t": "Your specific problems", "ar": "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ، رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي", "tr": "La ilaha illa anta subhanaka inni kuntu minaz-zalimin. Rabbish-rah li sadri wa yassir li amri", "en": "There is no god but You, glory be to You; I have been among the wrongdoers (Yunus's dua, Al-Anbiya' 21:87). My Lord, open my chest and make my task easy for me (Ta-Ha 20:25–26).", "own": "O Allah, there is no god but You, glory be to You, I have been among the wrongdoers. You saved Yunus from the darkness of the whale, the sea and the night, so save me from what I am going through: [name the problem]. Nothing is hard for You. Open my chest, make my task easy, and untie the knot from my tongue. Open a way out where I can't see one, and provide for me from where I don't expect. Give me patience until it comes, and don't leave me to myself, even for the blink of an eye."}, {"t": "Your children's future", "ar": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ", "tr": "Rabbij-'alni muqimas-salati wa min dhurriyyati, Rabbana wa taqabbal du'a'", "en": "My Lord, make me and my children keep up the prayer. Our Lord, accept my dua. (Ibrahim 14:40)", "own": "O Allah, guide {family}. Make them keep up the prayer, love the Quran and love Your Prophet ﷺ. Protect them from bad company, from harmful things online and from everything that weakens their faith. Give them good friends who remind them of You. Give them success in their studies, good character, and work that is halal and meaningful. When the time comes, give them righteous spouses and righteous children. Make them a sadaqah jariyah for us after we're gone, and never let us be the reason they are far from You."}, {"t": "Repentance", "ar": "أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيَّ الْقَيُّومَ وَأَتُوبُ إِلَيْهِ", "tr": "Astaghfirullahal-ladhi la ilaha illa huwal-Hayyul-Qayyumu wa atubu ilayh", "en": "I ask forgiveness of Allah, there is no god but He, the Ever-Living, the Sustainer, and I turn to Him in repentance. (Abu Dawud, Tirmidhi)", "own": "O Allah, I confess my sins to You. I know what I have done: [name them]. I regret them, I'm ashamed of them, and I promise not to go back to them. Forgive me, You are the Most Forgiving. Cover my faults in this world and on the Day of Judgement. Help me replace each bad habit with a good one, and keep me away from the places, people and screens that lead me back. If I slip, bring me back to You quickly. Make me one of those who turn to You often, whom You love."}, {"t": "That this Umrah is accepted", "ar": "رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ", "tr": "Rabbana taqabbal minna innaka antas-Sami'ul-'Alim", "en": "Our Lord, accept this from us. You are the All-Hearing, the All-Knowing. (Al-Baqarah 2:127, Ibrahim's dua while building the Kaaba)", "own": "O Allah, accept this Umrah from me and from {family}, as You accepted from Ibrahim and Ismail when they built Your House. Forgive whatever we did wrong in it, whatever we missed and whatever we did without full attention. Don't let our effort, our money or our tiredness go to waste. Let us leave here changed for the better, with softer hearts and stronger faith. Invite us back to Your House again and again, and let us come for Hajj before we die. Don't let this be our last visit."}, {"t": "Salawat", "ar": "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ", "tr": "Allahumma salli wa sallim 'ala nabiyyina Muhammad", "en": "O Allah, send blessings and peace on our Prophet Muhammad.", "own": "O Allah, send peace and blessings on our Prophet Muhammad ﷺ, his family and his companions, as many times as there are people who remember him and people who forget him. He suffered so that this religion would reach us. Let me follow his Sunnah in my prayer, my manners and my home. Make me love him more than myself, my family and all people. Let me visit him in Madinah with a clean heart, see him in my dreams and in Jannah, and drink from his hand at the Hawd, a drink after which we never thirst again."}, {"t": "Thanks, and your family", "ar": "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ", "tr": "Rabbi awzi'ni an ashkura ni'matakal-lati an'amta 'alayya wa 'ala walidayya wa an a'mala salihan tardah", "en": "My Lord, help me thank You for the blessings You gave me and my parents, and to do good that pleases You. (Al-Ahqaf 46:15)", "own": "O Allah, thank You for this Umrah, for my health, my family and every blessing I can't count. Thank You for the safe journey, the strength to walk, and the chance to stand here. Please fulfil the requests of {asked}. Bless {family}, and have mercy on {parents}. Bring us home safely, and keep what we gained here alive in our hearts. Make us better people when we return: more patient, more generous and more careful with our prayers. And don't let this be our last visit."}],where:n=>n>=7?"Sa'i done at Marwah.":(n%2===0?"Walk Safa → Marwah":"Walk Marwah → Safa")},items:[
  D("","Start after a complete tawaf, at Safa\nReach the marked end of each hill before turning\nMen: uncover the right shoulder again (Sunnah, Shafi'i)\nMen: jog lightly between the green lights (Sunnah)\nWudu isn't required, but it's better","","","Before you start sa'i"),
  D("إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ، أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ","Innas-Safa wal-Marwata min sha'a'irillah. Abda'u bima bada'allahu bih","Safa and Marwah are among the symbols of Allah. I begin with what Allah began with.","Say it once, as you approach Safa at the very start.","Approaching Safa"),
  D("اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ. لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ، أَنْجَزَ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الْأَحْزَابَ وَحْدَهُ","Allahu akbar ×3. La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamdu wa huwa 'ala kulli shay'in qadir. La ilaha illallahu wahdah, anjaza wa'dah, wa nasara 'abdah, wa hazamal-ahzaba wahdah","Allah is the Greatest. There is no god but Allah alone, without partner. His is the dominion and the praise, and He has power over all things. There is no god but Allah alone. He fulfilled His promise, helped His servant and defeated the confederates alone.","Face the Kaaba and raise your hands. Say the whole passage below → make your own dua → say the whole passage again → your own dua → say it a third time, then walk on. Do the same on Marwah.","On Safa and on Marwah"),
  D("رَبِّ اغْفِرْ وَارْحَمْ، وَاعْفُ وَتَكَرَّمْ، وَتَجَاوَزْ عَمَّا تَعْلَمُ، إِنَّكَ تَعْلَمُ مَا لَا نَعْلَمُ، إِنَّكَ أَنْتَ اللَّهُ الْأَعَزُّ الْأَكْرَمُ","Rabbighfir warham, wa'fu wa takarram, wa tajawaz 'amma ta'lam, innaka ta'lamu ma la na'lam, innaka antallahul-a'azzul-akram","My Lord, forgive and have mercy, pardon and be generous, and overlook what You know. You know what we do not know. You are Allah, the Most Mighty, the Most Generous.","Any dua is fine while walking.","While walking"),
  D("اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ","Allahumma inni as'aluka min fadlik","O Allah, I ask You of Your bounty.","Leave with your left foot.","Leaving the Masjid"),
  D("","Cut at least 3 hairs from your head. Men: shaving the whole head is best. Women: trim the ends in private; a fingertip's length is recommended.","This completes your Umrah and ends ihram.","Barbers are outside the Marwah exit.","Finish: cut the hair"),
  D("اللَّهُمَّ اجْعَلْ لِكُلِّ شَعْرَةٍ نُورًا يَوْمَ الْقِيَامَةِ\nالْحَمْدُ لِلَّهِ الَّذِي قَضَى عَنَّا مَنَاسِكَنَا","Before: Allahummaj'al likulli sha'ratin nuran yawmal-qiyamah\nAfter: Alhamdulillahil-ladhi qada 'anna manasikana","Before: O Allah, give a light for every hair on the Day of Resurrection.\nAfter: Praise be to Allah, who let us complete our rites.","Face the qiblah if you can.","While cutting the hair")]},
 {id:"madinah",label:"Madinah",lead:"1–5 Dec. For the Rawdah, check each person's Nusuk booking, gate and time.",items:[
  D("السَّلَامُ عَلَيْكَ يَا رَسُولَ اللَّهِ","Assalamu 'alaika ya Rasulallah","Peace be upon you, O Messenger of Allah.","At the Prophet's ﷺ grave, along the route the staff open. Keep your voice low and keep moving. You can also send salam from anywhere in the masjid.","Salam to the Prophet ﷺ"),
  D("السَّلَامُ عَلَيْكَ يَا أَبَا بَكْرٍ، السَّلَامُ عَلَيْكَ يَا عُمَرُ","Assalamu 'alaika ya Aba Bakr. Assalamu 'alaika ya 'Umar","Peace be upon you, O Abu Bakr. Peace be upon you, O Umar.","Just after the Prophet's ﷺ grave, along the same route.","Abu Bakr and Umar"),
  D("السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَلَاحِقُونَ، أَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ","Assalamu 'alaikum ahlad-diyari minal-mu'minina wal-muslimin, wa inna in sha' Allahu bikum lalahiqun. As'alullaha lana wa lakumul-'afiyah","Peace be upon you, believers and Muslims of these dwellings. If Allah wills, we will join you. I ask Allah for well-being for us and for you.","At Baqi' and at the martyrs of Uhud (2 Dec).","Greeting the people of the graves"),
  D("","Make wudu at the hotel, then pray 2 rakaat at Quba'","The Prophet ﷺ promised a reward like an Umrah for purifying yourself at home, then coming to pray here.","2 Dec, 8:00 am.","Masjid Quba'")]},
 {id:"anytime",label:"Anytime",lead:"For entering and leaving the masjid, Friday, and your farewell.",items:[
  D("بِسْمِ اللَّهِ وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","Bismillah, was-salatu was-salamu 'ala Rasulillah. Allahummaftah li abwaba rahmatik","In the name of Allah, peace and blessings on the Messenger of Allah. O Allah, open for me the doors of Your mercy.","Enter with your right foot.","Entering the Masjid"),
  D("اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ","Allahumma inni as'aluka min fadlik","O Allah, I ask You of Your bounty.","Leave with your left foot.","Leaving the Masjid"),
  D("اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ","Allahumma salli 'ala Muhammad wa 'ala ali Muhammad","O Allah, send blessings on Muhammad and the family of Muhammad.","Say plenty of salawat on Fridays (27 Nov, 4 Dec).","Salawat"),
  D("يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","Ya Hayyu ya Qayyum, birahmatika astaghith, aslih li sha'ni kullahu, wa la takilni ila nafsi tarfata 'ain","O Ever-Living, O Sustainer of all, by Your mercy I call for help. Set right all my affairs, and don't leave me to myself even for the blink of an eye.","Morning and evening, and whenever things feel heavy (Nasa'i, Hakim).","Morning and evening"),
  D("اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ النَّارِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ","Allahumma inni a'udhu bika min 'adhabil-qabr, wa min 'adhabin-nar, wa min fitnatil-mahya wal-mamat, wa min fitnatil-masihid-dajjal","O Allah, I seek refuge in You from the punishment of the grave, the punishment of the Fire, the trials of life and death, and the trial of the False Messiah.","In every prayer: after the salawat in the last tashahhud, before salam (Bukhari, Muslim).","Before salam"),
  D("","Tawaf Al-Wadaa' (1 Dec, 8:00 am)","Finish shopping and errands first. Intend farewell tawaf, 7 rounds with wudu, normal clothes, no sa'i. Then leave. Collecting bags, joining a prayer or waiting for your transport is fine. Women menstruating at departure are excused, with no dam.","","Leaving Makkah"),
  D("اللَّهُمَّ لَا تَجْعَلْ هَذَا آخِرَ الْعَهْدِ بِبَيْتِكَ الْحَرَامِ، وَإِنْ جَعَلْتَهُ فَعَوِّضْنِي عَنْهُ الْجَنَّةَ بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ","Allahumma la taj'al hadha akhiral-'ahdi bibaitikal-haram, wa in ja'altahu fa'awwidni 'anhul-jannah, birahmatika ya arhamar-rahimin","O Allah, don't make this my last visit to Your Sacred House. If You do, give me Jannah in its place, by Your mercy, O Most Merciful of the merciful.","After the farewell tawaf, at the Multazam if you can reach it, or anywhere.","Farewell dua")]},

const SEERAH=[
 ["Makkah",[
  ["The Kaaba","Every day","Built by Ibrahim and his son Ismail (Al-Baqarah 2:127). When the Quraysh rebuilt it, the Prophet ﷺ, then 35, settled their quarrel over who would set the Black Stone: he put it on a cloth, had every clan lift a corner, and placed it himself. At the conquest of Makkah in 8 AH, there were 360 idols around it, and he cleared them."],
  ["Safa, Marwah and Zamzam","Every Umrah","Hajar, left in this dry valley with baby Ismail, ran between the two hills 7 times looking for water. Allah sent Jibril and Zamzam burst from the ground. Your sa'i follows her steps."],
  ["Jabal Nour · Cave Hira","27 Nov","The Prophet ﷺ used to retreat here to worship. At 40, in Ramadan, Jibril came to him in this cave with the first revelation: “Iqra'”, read (Al-'Alaq 96:1–5). He came home trembling and Khadijah wrapped him and comforted him. The climb is a visit, not an act of worship."],
  ["Jabal Thur","28 Nov","On the Hijrah to Madinah, the Prophet ﷺ and Abu Bakr hid in a cave on this mountain for 3 nights. The Quraysh reached its mouth. He told Abu Bakr: “Don't grieve, Allah is with us” (At-Tawbah 9:40). Asma', Abu Bakr's daughter, climbed up with food."],
  ["Arafah and Jabal Rahmah","28 Nov","Standing at Arafah on 9 Dhul Hijjah is the heart of Hajj: “Hajj is Arafah.” On his Farewell Hajj in 10 AH, the Prophet ﷺ stood by the rocks at the foot of Jabal Rahmah. There is no Umrah rite or climb here."],
  ["Masjid Namirah","28 Nov","The Prophet ﷺ camped at Namirah and gave his Farewell Sermon in the nearby valley of 'Uranah. The front of the mosque lies outside Arafah; signs inside mark the boundary."],
  ["Muzdalifah","28 Nov","Pilgrims spend the night here after Arafah and remember Allah at Al-Mash'ar Al-Haram (Al-Baqarah 2:198)."],
  ["Jamarat and Masjid Khaif, Mina","28 Nov","During Hajj, pilgrims throw pebbles at the Jamarat. Ibn Abbas relates that Ibrahim threw pebbles when Shaytan appeared to him here. The Prophet ﷺ prayed in Masjid Khaif during his Hajj."]]],
 ["Taif · 29 Nov",[
  ["The journey to Taif","29 Nov","In the 10th year of prophethood, after his wife Khadijah and uncle Abu Talib died, the Prophet ﷺ walked to Taif to call its people. They mocked him and had boys stone him until his feet bled. Afterwards, the angel of the mountains offered to bring two mountains down on those who rejected him. He said: “I hope Allah will bring from them people who worship Him alone.” Within a generation, Taif was Muslim."],
  ["Masjid Abdullah ibn Abbas","29 Nov","Named after the Prophet's ﷺ cousin, for whom he prayed: “O Allah, give him understanding of the religion.” He became a leading Companion in Quran commentary, and died in Taif."]]],
 ["Madinah",[
  ["Masjid An-Nabawi","1–5 Dec","Built in 1 AH where the Prophet's ﷺ camel knelt on his arrival; he carried bricks himself. One prayer here is better than 1,000 elsewhere, except Masjid Al-Haram. He is buried in Aisyah's room, now inside the masjid, with Abu Bakr and Umar beside him."],
  ["The Rawdah","3 Dec","“Between my house and my minbar is a garden from the gardens of Paradise” (Bukhari, Muslim). Follow your permit and the stewards."],
  ["Masjid Quba'","2 Dec","The first masjid the Prophet ﷺ built on reaching Madinah on the Hijrah. He visited it on Saturdays. He promised a reward like an Umrah for making wudu at home, then coming to pray here."],
  ["Date farm · Ajwa","2 Dec","“Whoever eats 7 Ajwa dates in the morning will not be harmed by poison or magic that day” (Bukhari)."],
  ["Uhud","2 Dec","Battle of Uhud, 3 AH. Many of the archers on the small hill (Jabal Rumah) left their post despite their commander's warning, and the Muslims were struck from behind. 70 Companions were martyred, including the Prophet's ﷺ uncle Hamzah, buried here. He said: “Uhud is a mountain that loves us, and we love it.”"],
  ["Masjid Qiblatayn","2 Dec","“The masjid of two qiblas.” Traditionally linked to the change of qibla from Jerusalem to the Kaaba in 2 AH (Al-Baqarah 2:144). An authentic report names Quba' as a place where people turned mid-prayer on hearing the news."],
  ["Baqi'","Madinah","Madinah's main cemetery, next to the masjid. Uthman ibn Affan, many of the Prophet's ﷺ wives and his son Ibrahim are buried here."]]]];

const MS={"Itinerary":"Jadual",
"Men: no clothes cut to the body's shape (shirts, trousers, underwear, socks) and nothing covering the head\nWomen: nothing covering the face, no gloves\nNo perfume on the body or clothes, including scented soap, wipes and lotion\nNo oil or cream on the hair of the head or the beard (Shafi'i)\nNo removing hair or cutting nails on purpose\nNo intimacy or touching with desire. Deliberate intercourse before cutting the hair invalidates the Umrah: you stay in ihram, still finish it and make it up later, and an expiation may be due. Tell your mutawwif at once\nNo marriage contract, for yourself or for others (it would be invalid)\nNo hunting wild land game\nNo arguing or bad language\nAnywhere in Makkah's Haram, ihram or not: no hunting, and no cutting or uprooting wild plants and trees":"Lelaki: tidak memakai pakaian yang dipotong mengikut bentuk badan (baju, seluar, pakaian dalam, stoking) dan tidak menutup kepala\nWanita: tidak menutup muka, tidak memakai sarung tangan\nTidak memakai wangian pada badan atau pakaian, termasuk sabun, tisu basah dan losyen yang wangi\nTidak memakai minyak atau krim pada rambut kepala atau janggut (Syafi'i)\nTidak menghilangkan rambut atau bulu badan, dan tidak memotong kuku, dengan sengaja\nTidak bercumbu atau bersentuhan dengan syahwat. Bersetubuh dengan sengaja sebelum bergunting membatalkan umrah: anda kekal dalam ihram, tetap menyempurnakannya dan mengqadakannya kemudian, dan mungkin dikenakan dam. Beritahu mutawwif anda dengan segera\nTidak melakukan akad nikah, untuk diri sendiri atau untuk orang lain (akad itu tidak sah)\nTidak memburu binatang buruan darat yang liar\nTidak bertengkar atau bercakap kotor\nDi mana-mana dalam Tanah Haram Makkah, berihram atau tidak: tidak memburu, dan tidak memotong atau mencabut tumbuhan dan pokok liar",
"From the intention until you cut your hair. Cutting hair or nails needs a fidyah even if done by mistake; perfume or clothing by mistake does not. Ask your mutawwif before paying anything.":"Dari saat berniat hingga anda bergunting. Menghilangkan rambut atau bulu badan, atau memotong kuku, tetap dikenakan fidyah walaupun tidak sengaja; tersilap memakai wangian atau pakaian yang dilarang tidak dikenakan fidyah. Tanya mutawwif anda sebelum membayar apa-apa.",

"There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over all things.":"Tiada Tuhan melainkan Allah Yang Maha Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan bagi-Nya segala puji, dan Dia Maha Berkuasa atas segala sesuatu.",
"Your God is one God. There is no god but Him, the Most Compassionate, the Most Merciful. (Al-Baqarah 2:163)":"Tuhan kamu ialah Tuhan Yang Maha Esa. Tiada Tuhan melainkan Dia, Yang Maha Pemurah lagi Maha Penyayang. (Al-Baqarah 2:163)",
"Allah is enough for me. There is no god but Him. In Him I put my trust, and He is the Lord of the Mighty Throne. (At-Tawbah 9:129)":"Cukuplah Allah bagiku. Tiada Tuhan melainkan Dia. Kepada-Nya aku bertawakal, dan Dialah Tuhan yang memiliki Arasy yang agung. (At-Taubah 9:129)",
"Glory be to Allah, praise be to Allah, there is no god but Allah, and Allah is the Greatest.":"Maha Suci Allah, segala puji bagi Allah, tiada Tuhan melainkan Allah, dan Allah Maha Besar.",

"Some companions pressed their chest, cheek and arms to it and made dua. There are no set words: ask for what matters most to you.":"Sebahagian sahabat merapatkan dada, pipi dan lengan mereka padanya lalu berdoa. Tiada lafaz khusus: mohonlah apa yang paling penting bagi anda.",

"My Lord, forgive and have mercy, pardon and be generous, and overlook what You know. You know what we do not know. You are Allah, the Most Mighty, the Most Generous.":"Wahai Tuhanku, ampunilah dan rahmatilah, maafkanlah dan limpahkanlah kemurahan-Mu, dan ampunkanlah kesalahan yang Engkau ketahui. Sesungguhnya Engkau mengetahui apa yang tidak kami ketahui. Sesungguhnya Engkaulah Allah Yang Maha Perkasa lagi Maha Pemurah.",
"Any dua is fine while walking.":"Anda boleh membaca apa-apa doa semasa berjalan.",

"Before: O Allah, give a light for every hair on the Day of Resurrection.\nAfter: Praise be to Allah, who let us complete our rites.":"Sebelum: Ya Allah, kurniakanlah cahaya bagi setiap helai rambut pada Hari Kiamat.\nSelepas: Segala puji bagi Allah yang telah membolehkan kami menyempurnakan manasik kami.",
"Face the qiblah if you can.":"Hadap kiblat jika boleh.",

"O Ever-Living, O Sustainer of all, by Your mercy I call for help. Set right all my affairs, and don't leave me to myself even for the blink of an eye.":"Wahai Yang Maha Hidup, wahai Yang sentiasa mentadbir sekalian makhluk, dengan rahmat-Mu aku memohon pertolongan. Perbaikilah segala urusanku, dan jangan Engkau serahkan aku kepada diriku sendiri walaupun sekelip mata.",
"Morning and evening, and whenever things feel heavy (Nasa'i, Hakim).":"Pagi dan petang, dan bila-bila masa urusan terasa berat (Nasa'i, Hakim).",

"In every prayer: after the salawat in the last tashahhud, before salam (Bukhari, Muslim).":"Dalam setiap solat: selepas selawat dalam tasyahud akhir, sebelum salam (Bukhari, Muslim).",
"Farewell dua":"Doa perpisahan",
"O Allah, don't make this my last visit to Your Sacred House. If You do, give me Jannah in its place, by Your mercy, O Most Merciful of the merciful.":"Ya Allah, janganlah Engkau jadikan ini kunjunganku yang terakhir ke Rumah-Mu yang suci. Jika Engkau menetapkannya demikian, kurniakanlah syurga kepadaku sebagai gantinya, dengan rahmat-Mu, wahai Yang Maha Penyayang di antara para penyayang.",
"After the farewell tawaf, at the Multazam if you can reach it, or anywhere.":"Selepas tawaf wada', di Multazam jika dapat sampai ke sana, atau di mana-mana.",

"Change at Dubai (4:10–6:00 am, 25 Nov). Intend Umrah on the Dubai–Jeddah flight before the miqat. Second Umrah (27 Nov): go to Masjid Aisyah at Tan'im, outside the Haram boundary, and start ihram there.":"Tukar pakaian di Dubai (4:10–6:00 pg, 25 Nov). Berniat umrah dalam penerbangan Dubai–Jeddah sebelum miqat. Umrah kedua (27 Nov): pergi ke Masjid Aisyah di Tan'im, di luar sempadan Tanah Haram, dan mulakan ihram di sana.",

"Ghusl, or at least wudu (Sunnah)\nClip nails and trim before you start; you can wear perfume on your body before the intention (Sunnah)\nIhram clothes. Men: two wraps, head uncovered, no fitted clothes (shirts, trousers, underwear); stitched hems and belts are fine. Women: normal modest clothes, no niqab resting on the face, no gloves (Wajib)\nPray 2 rakaat sunnah ihram (Sunnah)":"Mandi sunat, atau sekurang-kurangnya berwuduk (Sunat)\nPotong kuku dan rapikan diri sebelum mula; boleh memakai wangian pada badan sebelum berniat (Sunat)\nPakaian ihram. Lelaki: dua helai kain ihram, kepala tidak ditutup, tiada pakaian yang mengikut bentuk badan, berjahit atau tidak (baju, seluar, pakaian dalam); jahitan di tepi kain dan tali pinggang dibenarkan. Wanita: pakaian biasa yang menutup aurat, tiada purdah yang menyentuh muka, tiada sarung tangan (Wajib)\nSolat sunat ihram 2 rakaat (Sunat)",
