"For women":"Untuk wanita",
"Menstruation or postnatal bleeding: enter ihram at the miqat as usual. Wait until bleeding ends and do ghusl before tawaf. If bleeding starts after tawaf, you can still do sa'i and cut your hair. If departure is close and tawaf isn't done, tell the mutawwif at once.":"Haid atau nifas: berihram di miqat seperti biasa. Tunggu sehingga darah berhenti dan mandi wajib sebelum tawaf. Jika darah haid atau nifas keluar selepas tawaf, anda masih boleh bersaie dan bergunting. Jika tarikh pulang sudah dekat dan tawaf belum dibuat, segera beritahu mutawwif.",
"Travel":"Musafir",
"Dua for travelling: say it when the plane, van or train moves off.":"Doa menaiki kenderaan: baca apabila kapal terbang, van atau kereta api mula bergerak.",
"Glory to the One who made this subservient to us. We could not have done it ourselves, and to our Lord we will return.":"Maha Suci Tuhan yang telah memudahkan kenderaan ini bagi kami, sedangkan kami tidak mampu menguasainya sendiri, dan sesungguhnya kepada Tuhan kamilah kami akan kembali.",
"Niyyah":"Niat",
"2 rakaat sunnah after tawaf · Maqam Ibrahim":"Solat sunat tawaf 2 rakaat · Maqam Ibrahim",
"The intention in your heart is what counts, made before the miqat. Say these words once as you intend (sunnah), then switch to the full talbiyah below. If unsure of the timing, intend early.":"Niat di dalam hati yang dikira, dibuat sebelum miqat. Lafazkan kata-kata ini sekali ketika berniat (sunat), kemudian teruskan dengan talbiah penuh di bawah. Jika tidak pasti masanya, berniatlah awal.",
"Here I am, O Allah, for Umrah.":"Aku sahut panggilan-Mu, ya Allah, untuk menunaikan umrah.",
"Talbiyah":"Talbiah",
"Say it often (men aloud, women softly) until you begin tawaf.":"Baca sebanyak-banyaknya (lelaki dengan suara kuat, wanita perlahan) sehingga anda mula bertawaf.",
"Here I am, O Allah, here I am. You have no partner. All praise, blessings and dominion are Yours. You have no partner.":"Aku sahut panggilan-Mu, ya Allah, aku sahut panggilan-Mu. Tiada sekutu bagi-Mu. Segala puji, nikmat dan kerajaan adalah milik-Mu. Tiada sekutu bagi-Mu.",
"7 rounds, anticlockwise, Kaaba on your left. Reset the counter before each Umrah.":"7 pusingan, lawan arah jam, Kaabah di sebelah kiri anda. Set semula pengira sebelum setiap umrah.",
"Next: 2 rakaat where there's space":"Seterusnya: solat 2 rakaat di mana ada ruang",
"Forgiveness and thanks":"Keampunan dan syukur",
"Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we will surely be among the losers. (Al-A'raf 7:23)":"Wahai Tuhan kami, kami telah menzalimi diri kami sendiri. Jika Engkau tidak mengampuni kami dan merahmati kami, nescaya kami termasuk orang yang rugi. (Al-A'raf 7:23)",
"O Allah, all praise is Yours for bringing me to Your House, when so many wish to come and cannot. You chose me for this, and I am not worthy of it. O Allah, I have wronged myself many times. Forgive all my sins, the big and the small, the old and the new, the ones I remember and the ones I've forgotten, the ones done in public and the ones done in private. Forgive the prayers I delayed, the words that hurt people, the time I wasted and the blessings I didn't thank You for. O Allah, clean my heart from pride, envy and showing off. Let me leave this place as pure as the day I was born, and help me stay that way when I go home.":"Ya Allah, segala puji bagi-Mu kerana membawaku ke Rumah-Mu, sedangkan ramai yang ingin datang tetapi tidak mampu. Engkau memilihku untuk ini, dan aku tidak layak menerimanya. Ya Allah, aku telah banyak kali menzalimi diriku. Ampunilah semua dosaku, yang besar dan yang kecil, yang lama dan yang baru, yang aku ingat dan yang aku lupa, yang dilakukan secara terang dan yang tersembunyi. Ampunilah solat yang aku lewatkan, kata-kata yang menyakiti orang, masa yang aku sia-siakan dan nikmat yang tidak aku syukuri. Ya Allah, bersihkanlah hatiku daripada sombong, dengki dan riak. Biarlah aku meninggalkan tempat ini sesuci hari aku dilahirkan, dan bantulah aku kekal begitu apabila pulang nanti.",
"Your parents":"Ibu bapa anda",
"My Lord, forgive me and my parents, and have mercy on them as they raised me when I was small. (Based on Al-Isra' 17:24)":"Wahai Tuhanku, ampunilah aku dan kedua ibu bapaku, dan rahmatilah mereka sebagaimana mereka memeliharaku sewaktu kecil. (Berdasarkan Al-Isra' 17:24)",
"O Allah, forgive {parents} and have mercy on them, as they raised me when I was small. They stayed up for me, fed me, taught me and prayed for me before I could pray for myself. Reward them for every sacrifice, every tear and every worry they carried for me. O Allah, give them good health, a long life in obedience to You, and hearts full of peace. Make their old age easy, protect them from needing anyone but You, and give them a peaceful ending with La ilaha illallah on their tongues. Forgive me for every time I was impatient with them or hurt them. Make me a child who brings them joy in this life and is a sadaqah jariyah for them after. And gather us all together in Jannatul Firdaus.":"Ya Allah, ampunilah {parents} dan rahmatilah mereka, sebagaimana mereka memeliharaku sewaktu kecil. Mereka berjaga malam untukku, memberiku makan, mengajarku dan mendoakanku sebelum aku mampu berdoa untuk diriku sendiri. Balaslah mereka atas setiap pengorbanan, setiap air mata dan setiap kerisauan yang mereka tanggung keranaku. Ya Allah, kurniakanlah mereka kesihatan yang baik, umur yang panjang dalam ketaatan kepada-Mu, dan hati yang penuh ketenangan. Mudahkanlah hari tua mereka, peliharalah mereka daripada bergantung kepada sesiapa selain-Mu, dan kurniakanlah mereka pengakhiran yang tenang dengan La ilaha illallah di lidah mereka. Ampunilah aku atas setiap kali aku tidak sabar dengan mereka atau menyakiti mereka. Jadikanlah aku anak yang menggembirakan mereka di dunia ini dan menjadi sedekah jariah bagi mereka selepasnya. Dan himpunkanlah kami semua bersama di Jannatul Firdaus.",
"Spouse and children":"Pasangan dan anak-anak",
"Our Lord, grant us spouses and children who are the coolness of our eyes, and make us leaders of the righteous. (Al-Furqan 25:74)":"Wahai Tuhan kami, kurniakanlah kepada kami pasangan dan zuriat yang menjadi penyejuk mata, dan jadikanlah kami pemimpin bagi orang yang bertakwa. (Al-Furqan 25:74)",
"O Allah, bless {family}. Make them the coolness of my eyes, and make me the coolness of theirs. Keep them safe wherever they are, healthy in body and mind, and close to You. O Allah, put love, mercy and patience in our home. Protect us from arguments, from jealousy and from anything that divides us. Make me a good spouse who is gentle and fair, and a parent who teaches by example. Guide our children to love You, Your Prophet ﷺ and the Quran. Make our home a place where Your name is remembered often. And let our family be together in Jannah, just as we are together here.":"Ya Allah, berkatilah {family}. Jadikanlah mereka penyejuk mataku, dan jadikanlah aku penyejuk mata mereka. Peliharalah mereka di mana jua mereka berada, sihat tubuh dan fikiran, dan dekat dengan-Mu. Ya Allah, tanamkanlah kasih sayang, rahmat dan kesabaran dalam rumah kami. Lindungilah kami daripada pertengkaran, daripada rasa cemburu dan daripada apa sahaja yang memecahbelahkan kami. Jadikanlah aku pasangan yang baik, lembut dan adil, dan ibu bapa yang mengajar dengan teladan. Bimbinglah anak-anak kami untuk mencintai-Mu, Nabi-Mu ﷺ dan al-Quran. Jadikanlah rumah kami tempat nama-Mu sering disebut. Dan himpunkanlah keluarga kami bersama di syurga, sebagaimana kami bersama di sini.",
"Health, rizq and work":"Kesihatan, rezeki dan kerja",
"O Allah, I ask You for pardon and well-being in this world and the next. O Allah, suffice me with what is halal instead of what is haram, and make me independent of all but You. (Abu Dawud, Tirmidhi)":"Ya Allah, aku memohon kepada-Mu keampunan dan kesejahteraan di dunia dan di akhirat. Ya Allah, cukupkanlah aku dengan yang halal daripada yang haram, dan kayakanlah aku dengan kurnia-Mu sehingga tidak berharap kepada selain-Mu. (Abu Dawud, Tirmizi)",
"O Allah, I ask You for pardon and well-being in my religion, my life, my family and my wealth. Give me and my family good health in body and mind, and protect us from serious illness and from being a burden on others. Cure those of us who are already sick. O Allah, give us rizq that is halal, plentiful and full of barakah. Bless my work: give me skill, honesty and good colleagues, open good doors for me and close the harmful ones. Free us from debt and from need of anyone but You. Make what You give us a means to do good, and don't let wealth distract us from You.":"Ya Allah, aku memohon kepada-Mu keampunan dan kesejahteraan dalam agamaku, hidupku, keluargaku dan hartaku. Kurniakanlah aku dan keluargaku kesihatan tubuh dan fikiran, dan lindungilah kami daripada penyakit yang berat dan daripada menjadi beban kepada orang lain. Sembuhkanlah mereka dalam kalangan kami yang sedang sakit. Ya Allah, kurniakanlah kami rezeki yang halal, melimpah dan penuh keberkatan. Berkatilah kerjaku: kurniakanlah aku kemahiran, kejujuran dan rakan sekerja yang baik, bukakanlah pintu-pintu kebaikan untukku dan tutuplah pintu-pintu yang memudaratkan. Bebaskanlah kami daripada hutang dan daripada berhajat kepada sesiapa selain-Mu. Jadikanlah apa yang Engkau kurniakan kepada kami jalan untuk berbuat baik, dan jangan biarkan harta melalaikan kami daripada-Mu.",
"People who asked you to pray":"Orang yang meminta didoakan",
"O Allah, fulfil their needs, forgive them and have mercy on them.":"Ya Allah, tunaikanlah hajat mereka, ampunilah mereka dan rahmatilah mereka.",
"O Allah, many people asked me to pray for them here: {asked}. You know each of their names and what is in their hearts better than I do. Please fulfil their requests in the way that is best for them. Cure those who are sick and ease their pain. Give children to those who long for them, spouses to those who are alone, and work to those who are looking. Settle the debts of those who are in debt, and ease the worries of those who are anxious. Guide those who are lost and bring them back to You. Accept their duas as You accept mine, bless their families, and reward them for trusting me with their hopes.":"Ya Allah, ramai orang meminta aku mendoakan mereka di sini: {asked}. Engkau lebih mengetahui nama setiap seorang daripada mereka dan apa yang ada dalam hati mereka. Tunaikanlah hajat mereka dengan cara yang terbaik bagi mereka. Sembuhkanlah yang sakit dan ringankanlah kesakitan mereka. Kurniakanlah zuriat kepada yang mendambakannya, pasangan kepada yang bersendirian, dan pekerjaan kepada yang sedang mencari. Lunaskanlah hutang mereka yang berhutang, dan redakanlah kerisauan mereka yang gelisah. Berilah hidayah kepada yang tersesat dan kembalikanlah mereka kepada-Mu. Perkenankanlah doa mereka sebagaimana Engkau memperkenankan doaku, berkatilah keluarga mereka, dan balaslah mereka kerana mempercayaiku membawa harapan mereka.",
"Those who passed away, and the Ummah":"Yang telah meninggal dunia, dan ummah",
"Our Lord, forgive us and our brothers who came before us in faith, and leave no ill will in our hearts towards the believers. Our Lord, You are Kind and Merciful. (Al-Hashr 59:10)":"Wahai Tuhan kami, ampunilah kami dan saudara-saudara kami yang telah mendahului kami dalam iman, dan jangan Engkau jadikan dalam hati kami rasa dengki terhadap orang yang beriman. Wahai Tuhan kami, sesungguhnya Engkau Maha Penyantun lagi Maha Penyayang. (Al-Hasyr 59:10)",
"O Allah, forgive {departed}. Have mercy on them, make their graves wide and full of light, and protect them from the punishment of the grave. Wash their sins away with water, snow and hail, and raise them among the people of Jannah. Let our duas and our good deeds reach them. O Allah, help the people of Gaza and every Muslim who is oppressed, hungry, sick, homeless or afraid. Give them safety, food, healing and victory. Unite the hearts of this Ummah, remove the hatred between us, and make us a source of mercy to the world. Forgive every Muslim, living and dead.":"Ya Allah, ampunilah {departed}. Rahmatilah mereka, luaskanlah kubur mereka dan penuhilah dengan cahaya, dan lindungilah mereka daripada azab kubur. Basuhlah dosa mereka dengan air, salji dan hujan batu, dan bangkitkanlah mereka bersama ahli syurga. Sampaikanlah doa dan amal baik kami kepada mereka. Ya Allah, bantulah penduduk Gaza dan setiap Muslim yang dizalimi, kelaparan, sakit, tiada tempat tinggal atau ketakutan. Kurniakanlah mereka keselamatan, makanan, penyembuhan dan kemenangan. Satukanlah hati ummah ini, hapuskanlah kebencian antara kami, dan jadikanlah kami sumber rahmat kepada dunia. Ampunilah setiap Muslim, yang hidup dan yang telah meninggal dunia.",
"A good ending and Jannah":"Pengakhiran yang baik dan syurga",
"O Turner of hearts, keep my heart firm on Your religion. O Allah, I ask You for Jannah and seek refuge in You from the Fire. (Tirmidhi, Abu Dawud)":"Wahai Tuhan yang membolak-balikkan hati, tetapkanlah hatiku di atas agama-Mu. Ya Allah, aku memohon syurga daripada-Mu dan berlindung dengan-Mu daripada neraka. (Tirmizi, Abu Dawud)",
"O Allah, I ask You for a good ending. Let my last words be La ilaha illallah, and let me die while You are pleased with me. Make the grave easy for me and my family: a garden from the gardens of Jannah, not a pit of the Fire. Make the reckoning light, give us our book in our right hands, make our scales heavy, and let us cross the Sirat like lightning. O Allah, grant us Jannatul Firdaus together, without reckoning and without punishment, and let us see Your Face. Whatever is left on my list, You know it already: grant it, O Most Generous, O Most Merciful.":"Ya Allah, aku memohon kepada-Mu pengakhiran yang baik. Jadikanlah kata-kata terakhirku La ilaha illallah, dan matikanlah aku dalam keadaan Engkau reda kepadaku. Mudahkanlah alam kubur bagiku dan keluargaku: sebuah taman daripada taman-taman syurga, bukan lubang daripada lubang-lubang neraka. Ringankanlah hisab kami, berikanlah kitab kami di tangan kanan, beratkanlah timbangan kami, dan lalukanlah kami di atas titian Sirat sepantas kilat. Ya Allah, kurniakanlah kami Jannatul Firdaus bersama-sama, tanpa hisab dan tanpa azab, dan izinkanlah kami melihat Wajah-Mu. Apa sahaja yang masih ada dalam senarai hajatku, Engkau sudah mengetahuinya: tunaikanlah, wahai Yang Maha Pemurah, wahai Yang Maha Penyayang.",
"Before you start tawaf":"Sebelum mula tawaf",
"Wudu, and free of major impurity\nAwrah covered as for prayer; women cover hair and feet\nBody and clothes clean of najasah\nStop the talbiyah (Sunnah)\nMen: uncover the right shoulder (Sunnah)\nStart just before the Black Stone line (green light) so your whole body passes it\nWalk outside the curved wall of Hijr Ismail, not through it":"Berwuduk, dan suci daripada hadas besar\nAurat ditutup seperti ketika solat; wanita menutup rambut dan kaki\nBadan dan pakaian bersih daripada najis\nBerhenti bertalbiah (Sunat)\nLelaki: dedahkan bahu kanan (Sunat)\nMulakan sedikit sebelum garisan Hajarul Aswad (lampu hijau) supaya seluruh badan melepasinya\nBerjalan di luar tembok melengkung Hijir Ismail, bukan melaluinya",
"During tawaf":"Semasa tawaf",
"Men: walk briskly in rounds 1–3 if there's space (Sunnah)\nRaise your right hand to the Black Stone each round. Don't push to kiss it (Sunnah)\nWudu breaks? Renew it and resume where you stopped. Unsure where? Restart that round at the Black Stone line. Completed rounds still count\nSkin contact with your spouse or an unrelated adult of the opposite sex breaks wudu (Shafi'i). Through clothing, or just doubt, does not\nUnsure of the count? Take the lower number":"Lelaki: berjalan pantas pada pusingan 1–3 jika ada ruang (Sunat)\nAngkat tangan kanan ke arah Hajarul Aswad setiap pusingan. Jangan berasak untuk menciumnya (Sunat)\nWuduk terbatal? Ambil wuduk semula dan sambung dari tempat anda berhenti. Tidak pasti di mana? Ulang pusingan itu dari garisan Hajarul Aswad. Pusingan yang sudah lengkap tetap dikira\nBersentuhan kulit dengan pasangan atau orang dewasa ajnabi berlainan jantina membatalkan wuduk (Syafie). Berlapik dengan pakaian, atau sekadar ragu-ragu, tidak membatalkan\nTidak pasti bilangan pusingan? Ambil bilangan yang lebih kecil",
"Entering the Masjid":"Masuk masjid",
"Enter with your right foot.":"Masuk dengan kaki kanan.",
"In the name of Allah, peace and blessings on the Messenger of Allah. O Allah, open for me the doors of Your mercy.":"Dengan nama Allah, selawat dan salam ke atas Rasulullah. Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.",
"First sight of the Kaaba":"Pertama kali melihat Kaabah",
"Optional. Reported from early scholars (the second part from Umar), not a fixed sunnah wording. Raise your hands, then make your most important dua in your own words. Keep the walkway clear.":"Pilihan. Diriwayatkan daripada ulama terdahulu (bahagian kedua daripada Umar), bukan lafaz sunnah yang tetap. Angkat tangan, kemudian panjatkan doa anda yang paling penting dengan kata-kata sendiri. Jangan halang laluan.",
"O Allah, increase this House in honour, greatness, dignity and awe, and increase those who honour it, among those who come for Hajj or Umrah, in honour, dignity, greatness and goodness. O Allah, You are Peace and from You comes peace, so greet us, our Lord, with peace.":"Ya Allah, tambahkanlah kemuliaan, keagungan, kehormatan dan kehebatan Rumah ini, dan tambahkanlah bagi sesiapa yang memuliakan dan menghormatinya, dalam kalangan yang menunaikan haji atau umrah, kemuliaan, kehormatan, keagungan dan kebaikan. Ya Allah, Engkaulah Yang Maha Sejahtera dan daripada-Mu datangnya kesejahteraan, maka sambutlah kami, wahai Tuhan kami, dengan kesejahteraan.",
"What to say in tawaf and sa'i":"Apa yang dibaca semasa tawaf dan saie",
"Keep your voice low. Avoid singing nasheeds or loud group chanting.":"Rendahkan suara. Elakkan menyanyikan nasyid atau berzikir beramai-ramai dengan kuat.",
"Make dua in Malay, English or any language. Quran, dhikr, salawat and calling Allah by His names (Ya Rahman, Ya Ghafur) are all good.":"Berdoalah dalam bahasa Melayu, Inggeris atau apa-apa bahasa. Al-Quran, zikir, selawat dan menyeru Allah dengan nama-nama-Nya (Ya Rahman, Ya Ghafur) semuanya baik.",
"No set words for each round or length.":"Tiada bacaan khusus bagi setiap pusingan atau perjalanan.",
"Each round":"Setiap pusingan",
"Face the Black Stone and raise your right hand towards it at the start of every round.":"Hadap Hajarul Aswad dan angkat tangan kanan ke arahnya pada permulaan setiap pusingan.",
"In the name of Allah, and Allah is the Greatest.":"Dengan nama Allah, dan Allah Maha Besar.",
"Yemeni Corner → Black Stone":"Rukun Yamani → Hajarul Aswad",
"Between the Yemeni Corner and the Black Stone.":"Antara Rukun Yamani dan Hajarul Aswad.",
"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.":"Wahai Tuhan kami, berikanlah kami kebaikan di dunia dan kebaikan di akhirat, dan peliharalah kami daripada azab neraka.",
"Men: cover both shoulders first. Recite this Quran verse (Al-Baqarah 2:125) as the Prophet ﷺ did; it is a verse, not a dua. Then pray 2 rakaat behind the Maqam, or wherever there's space: Al-Kafirun in the 1st, Al-Ikhlas in the 2nd.":"Lelaki: tutup kedua-dua bahu dahulu. Baca ayat al-Quran ini (Al-Baqarah 2:125) seperti yang dilakukan Nabi ﷺ; ia ayat, bukan doa. Kemudian solat 2 rakaat di belakang Maqam, atau di mana-mana yang ada ruang: Al-Kafirun pada rakaat pertama, Al-Ikhlas pada rakaat kedua.",
"Take the station of Ibrahim as a place of prayer.":"Jadikanlah Maqam Ibrahim itu tempat solat.",
"Face the Kaaba, say Bismillah and drink in 3 breaths, breathing outside the cup. Drink your fill and say Alhamdulillah. This dua is reported from Ibn Abbas; ask for anything you need.":"Hadap Kaabah, baca Bismillah dan minum dalam 3 nafas, bernafas di luar cawan. Minum sepuas-puasnya dan ucap Alhamdulillah. Doa ini diriwayatkan daripada Ibn Abbas; mintalah apa sahaja yang anda perlukan.",
"O Allah, I ask You for useful knowledge, plentiful provision and a cure for every illness.":"Ya Allah, aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang luas dan penyembuhan daripada segala penyakit.",
"3 · Sa'i":"3 · Saie",
"7 lengths: Safa → Marwah is 1, Marwah → Safa is 2. You finish at Marwah.":"7 perjalanan: Safa → Marwah dikira 1, Marwah → Safa dikira 2. Anda berakhir di Marwah.",
"Next: cut the hair":"Seterusnya: bergunting",
"Trust in Allah, like Hajar":"Bertawakal kepada Allah, seperti Hajar",
"Allah is enough for us, and He is the best to rely on. (Al 'Imran 3:173)":"Cukuplah Allah bagi kami, dan Dialah sebaik-baik tempat berserah. (Ali 'Imran 3:173)",
"O Allah, Hajar was left in this empty valley with a baby and no water. She said You would not abandon her, and she ran between these hills trusting You. You answered her with Zamzam, which still flows today. O Allah, I put my trust in You the same way. You know my worries better than I do: my family, my work, my health and my future. Take the weight of them from my chest. Replace my fear with calm and my anxiety with certainty. Make me content with whatever You decide, and show me the good in it.":"Ya Allah, Hajar ditinggalkan di lembah yang kosong ini bersama seorang bayi tanpa air. Dia yakin Engkau tidak akan mensia-siakannya, dan dia berlari antara bukit-bukit ini dengan bertawakal kepada-Mu. Engkau menjawabnya dengan Zamzam, yang masih mengalir hingga hari ini. Ya Allah, aku bertawakal kepada-Mu dengan cara yang sama. Engkau lebih mengetahui kerisauanku daripada diriku sendiri: keluargaku, kerjaku, kesihatanku dan masa depanku. Angkatlah beban itu dari dadaku. Gantikanlah ketakutanku dengan ketenangan dan kegelisahanku dengan keyakinan. Jadikanlah aku reda dengan apa sahaja yang Engkau tetapkan, dan tunjukkanlah kebaikan di sebaliknya.",
"Your specific problems":"Masalah khusus anda",
"There is no god but You, glory be to You; I have been among the wrongdoers (Yunus's dua, Al-Anbiya' 21:87). My Lord, open my chest and make my task easy for me (Ta-Ha 20:25–26).":"Tiada Tuhan melainkan Engkau, Maha Suci Engkau; sesungguhnya aku termasuk orang yang zalim (doa Nabi Yunus, Al-Anbiya' 21:87). Wahai Tuhanku, lapangkanlah dadaku dan mudahkanlah urusanku (Ta-Ha 20:25–26).",
"O Allah, there is no god but You, glory be to You, I have been among the wrongdoers. You saved Yunus from the darkness of the whale, the sea and the night, so save me from what I am going through: [name the problem]. Nothing is hard for You. Open my chest, make my task easy, and untie the knot from my tongue. Open a way out where I can't see one, and provide for me from where I don't expect. Give me patience until it comes, and don't leave me to myself, even for the blink of an eye.":"Ya Allah, tiada Tuhan melainkan Engkau, Maha Suci Engkau, sesungguhnya aku termasuk orang yang zalim. Engkau menyelamatkan Yunus daripada kegelapan perut ikan, lautan dan malam, maka selamatkanlah aku daripada apa yang sedang aku hadapi: [sebutkan masalahnya]. Tiada yang sukar bagi-Mu. Lapangkanlah dadaku, mudahkanlah urusanku, dan lepaskanlah kekeluan lidahku. Bukakanlah jalan keluar di tempat yang tidak dapat aku lihat, dan berilah aku rezeki dari arah yang tidak aku sangka. Kurniakanlah aku kesabaran sehingga ia tiba, dan jangan Engkau serahkan aku kepada diriku sendiri walaupun sekelip mata.",
"Your children's future":"Masa depan anak-anak anda",
"My Lord, make me and my children keep up the prayer. Our Lord, accept my dua. (Ibrahim 14:40)":"Wahai Tuhanku, jadikanlah aku dan zuriatku orang yang tetap mendirikan solat. Wahai Tuhan kami, perkenankanlah doaku. (Ibrahim 14:40)",
"O Allah, guide {family}. Make them keep up the prayer, love the Quran and love Your Prophet ﷺ. Protect them from bad company, from harmful things online and from everything that weakens their faith. Give them good friends who remind them of You. Give them success in their studies, good character, and work that is halal and meaningful. When the time comes, give them righteous spouses and righteous children. Make them a sadaqah jariyah for us after we're gone, and never let us be the reason they are far from You.":"Ya Allah, berilah hidayah kepada {family}. Jadikanlah mereka tetap mendirikan solat, mencintai al-Quran dan mencintai Nabi-Mu ﷺ. Lindungilah mereka daripada kawan yang buruk, daripada perkara berbahaya di alam maya dan daripada segala yang melemahkan iman mereka. Kurniakanlah mereka sahabat yang baik yang mengingatkan mereka kepada-Mu. Kurniakanlah mereka kejayaan dalam pelajaran, akhlak yang baik, dan pekerjaan yang halal dan bermakna. Apabila tiba masanya, kurniakanlah mereka pasangan yang soleh dan zuriat yang soleh. Jadikanlah mereka sedekah jariah bagi kami selepas kami tiada, dan jangan sekali-kali jadikan kami sebab mereka jauh daripada-Mu.",
"Repentance":"Taubat",
"I ask forgiveness of Allah, there is no god but He, the Ever-Living, the Sustainer, and I turn to Him in repentance. (Abu Dawud, Tirmidhi)":"Aku memohon ampun kepada Allah, tiada Tuhan melainkan Dia, Yang Maha Hidup lagi Maha Berdiri Sendiri, dan aku bertaubat kepada-Nya. (Abu Dawud, Tirmizi)",
"O Allah, I confess my sins to You. I know what I have done: [name them]. I regret them, I'm ashamed of them, and I promise not to go back to them. Forgive me, You are the Most Forgiving. Cover my faults in this world and on the Day of Judgement. Help me replace each bad habit with a good one, and keep me away from the places, people and screens that lead me back. If I slip, bring me back to You quickly. Make me one of those who turn to You often, whom You love.":"Ya Allah, aku mengaku dosa-dosaku kepada-Mu. Aku tahu apa yang telah aku lakukan: [sebutkan]. Aku menyesalinya, aku malu dengannya, dan aku berjanji tidak akan kembali kepadanya. Ampunilah aku, Engkaulah Yang Maha Pengampun. Tutupilah aib-aibku di dunia ini dan pada Hari Pembalasan. Bantulah aku menggantikan setiap tabiat buruk dengan yang baik, dan jauhkanlah aku daripada tempat, orang dan skrin yang membawaku kembali kepadanya. Jika aku tergelincir, kembalikanlah aku kepada-Mu dengan segera. Jadikanlah aku dalam kalangan mereka yang sering bertaubat kepada-Mu, yang Engkau cintai.",
"That this Umrah is accepted":"Agar umrah ini diterima",
"Our Lord, accept this from us. You are the All-Hearing, the All-Knowing. (Al-Baqarah 2:127, Ibrahim's dua while building the Kaaba)":"Wahai Tuhan kami, terimalah daripada kami. Sesungguhnya Engkau Maha Mendengar lagi Maha Mengetahui. (Al-Baqarah 2:127, doa Nabi Ibrahim ketika membina Kaabah)",
"O Allah, accept this Umrah from me and from {family}, as You accepted from Ibrahim and Ismail when they built Your House. Forgive whatever we did wrong in it, whatever we missed and whatever we did without full attention. Don't let our effort, our money or our tiredness go to waste. Let us leave here changed for the better, with softer hearts and stronger faith. Invite us back to Your House again and again, and let us come for Hajj before we die. Don't let this be our last visit.":"Ya Allah, terimalah umrah ini daripadaku dan daripada {family}, sebagaimana Engkau menerima daripada Ibrahim dan Ismail ketika mereka membina Rumah-Mu. Ampunilah apa sahaja kesilapan kami di dalamnya, apa yang kami tertinggal dan apa yang kami lakukan tanpa sepenuh perhatian. Jangan biarkan usaha, wang dan penat lelah kami sia-sia. Biarlah kami pulang dalam keadaan berubah menjadi lebih baik, dengan hati yang lebih lembut dan iman yang lebih kuat. Jemputlah kami kembali ke Rumah-Mu berulang kali, dan izinkanlah kami menunaikan haji sebelum kami mati. Jangan jadikan ini kunjungan terakhir kami.",
"Salawat":"Selawat",
"O Allah, send blessings and peace on our Prophet Muhammad.":"Ya Allah, limpahkanlah selawat dan salam ke atas Nabi kami Muhammad.",
"O Allah, send peace and blessings on our Prophet Muhammad ﷺ, his family and his companions, as many times as there are people who remember him and people who forget him. He suffered so that this religion would reach us. Let me follow his Sunnah in my prayer, my manners and my home. Make me love him more than myself, my family and all people. Let me visit him in Madinah with a clean heart, see him in my dreams and in Jannah, and drink from his hand at the Hawd, a drink after which we never thirst again.":"Ya Allah, limpahkanlah selawat dan salam ke atas Nabi kami Muhammad ﷺ, keluarga dan para sahabatnya, sebanyak bilangan orang yang mengingatinya dan orang yang melupakannya. Baginda menanggung kesusahan agar agama ini sampai kepada kami. Bantulah aku mengikut sunnahnya dalam solatku, akhlakku dan rumahku. Jadikanlah aku mencintainya lebih daripada diriku, keluargaku dan seluruh manusia. Izinkanlah aku menziarahinya di Madinah dengan hati yang bersih, melihatnya dalam mimpiku dan di syurga, dan minum dari tangannya di telaga Haud, minuman yang selepasnya kami tidak akan dahaga lagi.",
"Thanks, and your family":"Syukur, dan keluarga anda",
"My Lord, help me thank You for the blessings You gave me and my parents, and to do good that pleases You. (Al-Ahqaf 46:15)":"Wahai Tuhanku, ilhamkanlah aku untuk mensyukuri nikmat-Mu yang telah Engkau kurniakan kepadaku dan kepada ibu bapaku, dan untuk melakukan amal soleh yang Engkau redai. (Al-Ahqaf 46:15)",
"O Allah, thank You for this Umrah, for my health, my family and every blessing I can't count. Thank You for the safe journey, the strength to walk, and the chance to stand here. Please fulfil the requests of {asked}. Bless {family}, and have mercy on {parents}. Bring us home safely, and keep what we gained here alive in our hearts. Make us better people when we return: more patient, more generous and more careful with our prayers. And don't let this be our last visit.":"Ya Allah, terima kasih atas umrah ini, atas kesihatanku, keluargaku dan setiap nikmat yang tidak terhitung. Terima kasih atas perjalanan yang selamat, kekuatan untuk berjalan, dan peluang untuk berdiri di sini. Tunaikanlah hajat {asked}. Berkatilah {family}, dan rahmatilah {parents}. Bawalah kami pulang dengan selamat, dan hidupkanlah dalam hati kami apa yang kami peroleh di sini. Jadikanlah kami insan yang lebih baik apabila pulang: lebih sabar, lebih pemurah dan lebih menjaga solat. Dan jangan jadikan ini kunjungan terakhir kami.",
"Before you start sa'i":"Sebelum mula saie",
"Start after a complete tawaf, at Safa\nReach the marked end of each hill before turning\nMen: uncover the right shoulder again (Sunnah, Shafi'i)\nMen: jog lightly between the green lights (Sunnah)\nWudu isn't required, but it's better":"Mulakan selepas tawaf yang lengkap, di Safa\nSampai ke hujung bukit yang bertanda sebelum berpusing\nLelaki: dedahkan bahu kanan semula (Sunat, Syafie)\nLelaki: berlari-lari anak di antara lampu hijau (Sunat)\nWuduk tidak wajib, tetapi lebih baik",
"Approaching Safa":"Menghampiri Safa",
"Say it once, as you approach Safa at the very start.":"Baca sekali, ketika menghampiri Safa pada permulaan.",
"Safa and Marwah are among the symbols of Allah. I begin with what Allah began with.":"Sesungguhnya Safa dan Marwah adalah sebahagian daripada syiar Allah. Aku mulakan dengan apa yang Allah mulakan.",
"On Safa and on Marwah":"Di Safa dan di Marwah",
"Face the Kaaba and raise your hands. Say the whole passage below → make your own dua → say the whole passage again → your own dua → say it a third time, then walk on. Do the same on Marwah.":"Hadap Kaabah dan angkat tangan. Baca keseluruhan bacaan di bawah → berdoa sendiri → baca sekali lagi → berdoa sendiri → baca kali ketiga, kemudian teruskan berjalan. Lakukan yang sama di Marwah.",
"Allah is the Greatest. There is no god but Allah alone, without partner. His is the dominion and the praise, and He has power over all things. There is no god but Allah alone. He fulfilled His promise, helped His servant and defeated the confederates alone.":"Allah Maha Besar. Tiada Tuhan melainkan Allah Yang Maha Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan bagi-Nya segala puji, dan Dia Maha Berkuasa atas segala sesuatu. Tiada Tuhan melainkan Allah Yang Maha Esa. Dia telah menunaikan janji-Nya, menolong hamba-Nya dan mengalahkan tentera bersekutu dengan sendiri-Nya.",
"While walking":"Semasa berjalan",
"Finish: cut the hair":"Akhir: bergunting",
"Barbers are outside the Marwah exit.":"Tukang gunting ada di luar pintu keluar Marwah.",
"This completes your Umrah and ends ihram.":"Ini melengkapkan umrah anda dan menamatkan ihram.",
"Cut at least 3 hairs from your head. Men: shaving the whole head is best. Women: trim the ends in private; a fingertip's length is recommended.":"Gunting sekurang-kurangnya 3 helai rambut. Lelaki: bercukur seluruh kepala adalah lebih baik. Wanita: potong hujung rambut di tempat tertutup; sepanjang hujung jari adalah digalakkan.",
"1–5 Dec. For the Rawdah, check each person's Nusuk booking, gate and time.":"1–5 Dis. Untuk Raudhah, semak tempahan Nusuk, pintu dan masa setiap orang.",
"Salam to the Prophet ﷺ":"Salam kepada Nabi ﷺ",
"At the Prophet's ﷺ grave, along the route the staff open. Keep your voice low and keep moving. You can also send salam from anywhere in the masjid.":"Di makam Nabi ﷺ, mengikut laluan yang dibuka petugas. Rendahkan suara dan terus bergerak. Anda juga boleh memberi salam dari mana-mana dalam masjid.",
"Peace be upon you, O Messenger of Allah.":"Salam sejahtera ke atasmu, wahai Rasulullah.",
"Abu Bakr and Umar":"Abu Bakar dan Umar",
"Just after the Prophet's ﷺ grave, along the same route.":"Sejurus selepas makam Nabi ﷺ, di laluan yang sama.",
"Peace be upon you, O Abu Bakr. Peace be upon you, O Umar.":"Salam sejahtera ke atasmu, wahai Abu Bakar. Salam sejahtera ke atasmu, wahai Umar.",
"Greeting the people of the graves":"Salam kepada ahli kubur",
"At Baqi' and at the martyrs of Uhud (2 Dec).":"Di Baqi' dan di makam para syuhada Uhud (2 Dis).",
"Peace be upon you, believers and Muslims of these dwellings. If Allah wills, we will join you. I ask Allah for well-being for us and for you.":"Salam sejahtera ke atas kamu, wahai penghuni kediaman ini daripada kalangan orang beriman dan Muslim. Insya-Allah kami akan menyusuli kamu. Aku memohon kepada Allah kesejahteraan untuk kami dan untuk kamu.",
"2 Dec, 8:00 am.":"2 Dis, 8:00 pg.",
"The Prophet ﷺ promised a reward like an Umrah for purifying yourself at home, then coming to pray here.":"Nabi ﷺ menjanjikan pahala seperti umrah bagi sesiapa yang bersuci di rumah, kemudian datang bersolat di sini.",
"Make wudu at the hotel, then pray 2 rakaat at Quba'":"Ambil wuduk di hotel, kemudian solat 2 rakaat di Quba'",
"Anytime":"Bila-bila masa",
"For entering and leaving the masjid, Friday, and your farewell.":"Untuk masuk dan keluar masjid, hari Jumaat, dan perpisahan anda.",
"Leaving the Masjid":"Keluar masjid",
"Leave with your left foot.":"Keluar dengan kaki kiri.",
"O Allah, I ask You of Your bounty.":"Ya Allah, aku memohon kepada-Mu daripada kurnia-Mu.",
"Say plenty of salawat on Fridays (27 Nov, 4 Dec).":"Perbanyakkan selawat pada hari Jumaat (27 Nov, 4 Dis).",
"O Allah, send blessings on Muhammad and the family of Muhammad.":"Ya Allah, limpahkanlah selawat ke atas Muhammad dan ke atas keluarga Muhammad.",
"Leaving Makkah":"Meninggalkan Makkah",
"Finish shopping and errands first. Intend farewell tawaf, 7 rounds with wudu, normal clothes, no sa'i. Then leave. Collecting bags, joining a prayer or waiting for your transport is fine. Women menstruating at departure are excused, with no dam.":"Selesaikan membeli-belah dan urusan dahulu. Berniat tawaf wada', 7 pusingan dengan wuduk, pakaian biasa, tanpa saie. Kemudian bertolak. Mengambil beg, solat berjemaah atau menunggu kenderaan tidak mengapa. Wanita yang haid ketika bertolak dikecualikan, tanpa dam.",
"Tawaf Al-Wadaa' (1 Dec, 8:00 am)":"Tawaf Wada' (1 Dis, 8:00 pg)",
"Places":"Tempat",
"Crowds":"Kesesakan",
"My duas":"Doa saya",
"9:15 pm: meet at Changi T1":"9:15 mlm: berkumpul di Changi T1",
"Fly via Dubai, ihram, land in Jeddah 9:20 am. First Umrah at 1:00 pm.":"Terbang melalui Dubai, berihram, mendarat di Jeddah 9:20 pg. Umrah pertama pada 1:00 ptg.",
"Ibadah at Masjid Al-Haram":"Beribadah di Masjidil Haram",

"The Kaaba":"Kaabah",
"Every day":"Setiap hari",
"Built by Ibrahim and his son Ismail (Al-Baqarah 2:127). When the Quraysh rebuilt it, the Prophet ﷺ, then 35, settled their quarrel over who would set the Black Stone: he put it on a cloth, had every clan lift a corner, and placed it himself. At the conquest of Makkah in 8 AH, there were 360 idols around it, and he cleared them.":"Dibina oleh Ibrahim dan anaknya Ismail (Al-Baqarah 2:127). Ketika Quraisy membinanya semula, Nabi ﷺ yang ketika itu berusia 35 tahun meredakan pertelingkahan mereka tentang siapa yang akan meletakkan Hajarul Aswad: baginda meletakkannya di atas sehelai kain, meminta setiap kabilah mengangkat satu bucu, lalu meletakkannya sendiri. Semasa pembukaan Makkah pada 8 H, terdapat 360 berhala di sekelilingnya, dan baginda membersihkannya.",
"Safa, Marwah and Zamzam":"Safa, Marwah dan Zamzam",
"Every Umrah":"Setiap umrah",
"Hajar, left in this dry valley with baby Ismail, ran between the two hills 7 times looking for water. Allah sent Jibril and Zamzam burst from the ground. Your sa'i follows her steps.":"Hajar, yang ditinggalkan di lembah kering ini bersama bayi Ismail, berlari antara dua bukit sebanyak 7 kali mencari air. Allah mengutus Jibril lalu Zamzam memancar dari bumi. Saie anda mengikut jejak langkahnya.",
"Jabal Nour · Cave Hira":"Jabal Nur · Gua Hira",
"The Prophet ﷺ used to retreat here to worship. At 40, in Ramadan, Jibril came to him in this cave with the first revelation: “Iqra'”, read (Al-'Alaq 96:1–5). He came home trembling and Khadijah wrapped him and comforted him. The climb is a visit, not an act of worship.":"Nabi ﷺ sering beruzlah di sini untuk beribadah. Pada usia 40 tahun, dalam bulan Ramadan, Jibril datang kepada baginda di gua ini membawa wahyu pertama: “Iqra'”, bacalah (Al-'Alaq 96:1–5). Baginda pulang dalam keadaan menggigil dan Khadijah menyelimuti serta menenangkan baginda. Mendaki ke sini ialah lawatan, bukan ibadah.",
"On the Hijrah to Madinah, the Prophet ﷺ and Abu Bakr hid in a cave on this mountain for 3 nights. The Quraysh reached its mouth. He told Abu Bakr: “Don't grieve, Allah is with us” (At-Tawbah 9:40). Asma', Abu Bakr's daughter, climbed up with food.":"Semasa Hijrah ke Madinah, Nabi ﷺ dan Abu Bakar bersembunyi dalam sebuah gua di gunung ini selama 3 malam. Quraisy sampai ke mulut gua. Baginda berkata kepada Abu Bakar: “Jangan bersedih, sesungguhnya Allah bersama kita” (At-Taubah 9:40). Asma', anak perempuan Abu Bakar, mendaki membawa makanan.",
"Arafah and Jabal Rahmah":"Arafah dan Jabal Rahmah",
"Standing at Arafah on 9 Dhul Hijjah is the heart of Hajj: “Hajj is Arafah.” On his Farewell Hajj in 10 AH, the Prophet ﷺ stood by the rocks at the foot of Jabal Rahmah. There is no Umrah rite or climb here.":"Wukuf di Arafah pada 9 Zulhijjah ialah teras haji: “Haji itu Arafah.” Semasa Haji Wada' pada 10 H, Nabi ﷺ berwukuf di tepi batu-batu di kaki Jabal Rahmah. Tiada amalan umrah atau pendakian di sini.",
"The Prophet ﷺ camped at Namirah and gave his Farewell Sermon in the nearby valley of 'Uranah. The front of the mosque lies outside Arafah; signs inside mark the boundary.":"Nabi ﷺ berkhemah di Namirah dan menyampaikan Khutbah Wada' di lembah 'Uranah yang berhampiran. Bahagian hadapan masjid terletak di luar Arafah; papan tanda di dalamnya menandakan sempadan.",
"Pilgrims spend the night here after Arafah and remember Allah at Al-Mash'ar Al-Haram (Al-Baqarah 2:198).":"Jemaah bermalam di sini selepas Arafah dan berzikir kepada Allah di Al-Masy'aril Haram (Al-Baqarah 2:198).",
"Jamarat and Masjid Khaif, Mina":"Jamrah dan Masjid Khaif, Mina",
"During Hajj, pilgrims throw pebbles at the Jamarat. Ibn Abbas relates that Ibrahim threw pebbles when Shaytan appeared to him here. The Prophet ﷺ prayed in Masjid Khaif during his Hajj.":"Semasa haji, jemaah melontar batu di Jamrah. Ibnu Abbas meriwayatkan bahawa Ibrahim melontar batu apabila syaitan menampakkan diri kepadanya di sini. Nabi ﷺ bersolat di Masjid Khaif semasa haji baginda.",
"The journey to Taif":"Perjalanan ke Taif",
"In the 10th year of prophethood, after his wife Khadijah and uncle Abu Talib died, the Prophet ﷺ walked to Taif to call its people. They mocked him and had boys stone him until his feet bled. Afterwards, the angel of the mountains offered to bring two mountains down on those who rejected him. He said: “I hope Allah will bring from them people who worship Him alone.” Within a generation, Taif was Muslim.":"Pada tahun ke-10 kenabian, selepas isteri baginda Khadijah dan bapa saudara baginda Abu Talib wafat, Nabi ﷺ berjalan ke Taif untuk menyeru penduduknya. Mereka mengejek baginda dan menyuruh budak-budak melontar batu sehingga kaki baginda berdarah. Selepas itu, malaikat penjaga gunung menawarkan untuk menghempapkan dua gunung ke atas mereka yang menolak baginda. Baginda bersabda: “Aku berharap Allah akan mengeluarkan daripada keturunan mereka orang yang menyembah-Nya semata-mata.” Dalam satu generasi, Taif memeluk Islam.",
"Named after the Prophet's ﷺ cousin, for whom he prayed: “O Allah, give him understanding of the religion.” He became a leading Companion in Quran commentary, and died in Taif.":"Dinamakan sempena sepupu Nabi ﷺ yang baginda doakan: “Ya Allah, berilah dia kefahaman dalam agama.” Beliau menjadi sahabat terkemuka dalam tafsir al-Quran, dan wafat di Taif.",
"Masjid An-Nabawi":"Masjid Nabawi",
"1–5 Dec":"1–5 Dis",
"Built in 1 AH where the Prophet's ﷺ camel knelt on his arrival; he carried bricks himself. One prayer here is better than 1,000 elsewhere, except Masjid Al-Haram. He is buried in Aisyah's room, now inside the masjid, with Abu Bakr and Umar beside him.":"Dibina pada 1 H di tempat unta Nabi ﷺ berlutut ketika baginda tiba; baginda sendiri mengangkat bata. Satu solat di sini lebih baik daripada 1,000 solat di tempat lain, kecuali Masjidil Haram. Baginda dimakamkan di bilik Aisyah, kini di dalam masjid, bersama Abu Bakar dan Umar di sisinya.",
"The Rawdah":"Raudhah",
"3 Dec":"3 Dis",
"“Between my house and my minbar is a garden from the gardens of Paradise” (Bukhari, Muslim). Follow your permit and the stewards.":"“Antara rumahku dan mimbarku ialah sebuah taman daripada taman-taman syurga” (Bukhari, Muslim). Ikut permit anda dan arahan petugas.",
"2 Dec":"2 Dis",
"The first masjid the Prophet ﷺ built on reaching Madinah on the Hijrah. He visited it on Saturdays. He promised a reward like an Umrah for making wudu at home, then coming to pray here.":"Masjid pertama yang dibina oleh Nabi ﷺ setibanya di Madinah semasa Hijrah. Baginda menziarahinya setiap hari Sabtu. Baginda menjanjikan pahala seperti umrah bagi sesiapa yang berwuduk di rumah, kemudian datang bersolat di sini.",
"Date farm · Ajwa":"Ladang kurma · Ajwa",
"“Whoever eats 7 Ajwa dates in the morning will not be harmed by poison or magic that day” (Bukhari).":"“Sesiapa yang memakan 7 biji kurma Ajwa pada waktu pagi, dia tidak akan dimudaratkan oleh racun atau sihir pada hari itu” (Bukhari).",
"Battle of Uhud, 3 AH. Many of the archers on the small hill (Jabal Rumah) left their post despite their commander's warning, and the Muslims were struck from behind. 70 Companions were martyred, including the Prophet's ﷺ uncle Hamzah, buried here. He said: “Uhud is a mountain that loves us, and we love it.”":"Perang Uhud, 3 H. Ramai pemanah di bukit kecil (Jabal Rumah) meninggalkan kedudukan mereka walaupun telah diberi amaran oleh ketua mereka, lalu tentera Islam diserang dari belakang. 70 sahabat syahid, termasuk bapa saudara Nabi ﷺ, Hamzah, yang dimakamkan di sini. Baginda bersabda: “Uhud ialah gunung yang mencintai kita, dan kita mencintainya.”",
"Masjid Qiblatayn":"Masjid Qiblatain",
"“The masjid of two qiblas.” Traditionally linked to the change of qibla from Jerusalem to the Kaaba in 2 AH (Al-Baqarah 2:144). An authentic report names Quba' as a place where people turned mid-prayer on hearing the news.":"“Masjid dua kiblat.” Secara tradisi dikaitkan dengan perubahan kiblat dari Baitulmaqdis ke Kaabah pada 2 H (Al-Baqarah 2:144). Satu riwayat sahih menyebut Quba' sebagai tempat orang ramai berpusing di tengah-tengah solat apabila mendengar berita itu.",
"Madinah's main cemetery, next to the masjid. Uthman ibn Affan, many of the Prophet's ﷺ wives and his son Ibrahim are buried here.":"Tanah perkuburan utama Madinah, bersebelahan masjid. Uthman bin Affan, ramai isteri Nabi ﷺ dan putera baginda Ibrahim dimakamkan di sini."};

 fetch(WX_URL).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{
  if(!Array.isArray(j)||j.length!==3||!j.every(c=>c.daily&&c.hourly))throw new Error("bad weather data");
  WX={t:Date.now(),data:j.map(c=>({daily:c.daily,hourly:c.hourly}))};store.set("wx",WX);rerender()}).catch(()=>{}).finally(()=>{wxBusy=false})}
function daily(c,d){const x=WX&&WX.data[CITIES[c].i];if(!x)return null;const i=x.daily.time.indexOf(d);if(i<0||x.daily.temperature_2m_max[i]==null)return null;
 return{code:x.daily.weather_code[i],max:Math.round(x.daily.temperature_2m_max[i]),min:Math.round(x.daily.temperature_2m_min[i]),rain:x.daily.precipitation_probability_max[i]||0}}

 return{temp:Math.round(x.hourly.temperature_2m[i]),feel:Math.round(x.hourly.apparent_temperature[i]),code:x.hourly.weather_code[i],rain:x.hourly.precipitation_probability[i]||0}}

/* ---------- Prayer times: Umm al-Qura (Fajr 18.5°, Isha = Maghrib + 90 min), Asr Shafi'i ---------- */
function prayTimes(day,{lat,lon}){const[y0,m0,d]=day.split("-").map(Number);let y=y0,m=m0;if(m<=2){y-=1;m+=12}
 const A=Math.floor(y/100),B=2-A+Math.floor(A/4),jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5-lon/360;
 const r=Math.PI/180,sin=x=>Math.sin(x*r),cos=x=>Math.cos(x*r),tan=x=>Math.tan(x*r),asin=x=>Math.asin(x)/r,acos=x=>Math.acos(x)/r,atan2=(a,b)=>Math.atan2(a,b)/r,acot=x=>Math.atan(1/x)/r;
 const fix=(a,b)=>{a-=b*Math.floor(a/b);return a<0?a+b:a};
 const sun=f=>{const D=jd+f-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-.00000036*D,RA=fix(atan2(cos(e)*sin(L),cos(L))/15,24);return{decl:asin(sin(e)*sin(L)),eqt:q/15-RA}};
 const noon=h=>fix(12-sun(h/24).eqt,24);
 const at=(a,h,before)=>{const s=sun(h/24),T=acos((-sin(a)-sin(s.decl)*sin(lat))/(cos(s.decl)*cos(lat)))/15;return noon(h)+(before?-T:T)};
 const asr=h=>{const s=sun(h/24);return at(-acot(1+tan(Math.abs(lat-s.decl))),h)};
 let p={f:5,sr:6,dh:12,as:13,mg:18};
 for(let k=0;k<2;k++)p={f:at(18.5,p.f,1),sr:at(.833,p.sr,1),dh:noon(p.dh),as:asr(p.as),mg:at(.833,p.mg)};
 const loc=h=>h+3-lon/15,out=[p.f,p.sr,p.dh,p.as,p.mg].map(loc);out.push(out[4]+1.5);
 return out.map(h=>Math.round(h*60))}

/* ---------- Places ---------- */
const scrollToEl=(el,smooth)=>{if(!el)return;const off=bar.hidden?12:bar.getBoundingClientRect().height+12;scrollTo({top:el.getBoundingClientRect().top+scrollY-off,behavior:smooth?"smooth":"auto"})};
/* A smooth jump survives a re-render or layout shift mid-scroll (e.g. weather arriving): a short watchdog re-aims at the re-queried target until it lands. */
let jump=null;
const endJump=()=>{if(jump)clearInterval(jump.iv);jump=null};
const reAim=force=>{if(!jump)return;const el=document.querySelector(jump.sel);if(!el||Date.now()>jump.until){endJump();return}
 const off=el.getBoundingClientRect().top-(bar.hidden?12:bar.getBoundingClientRect().height+12),atEnd=scrollY+innerHeight>=document.documentElement.scrollHeight-2;
 if(Math.abs(off)<=4||(atEnd&&off>0)){jump.y=scrollY;return}
 if(force||scrollY===jump.y)scrollToEl(el,true);jump.y=scrollY};
const jumpTo=sel=>{endJump();jump={sel,until:Date.now()+4000,y:-1,iv:setInterval(()=>reAim(false),200)};scrollToEl(document.querySelector(sel),true)};
["touchstart","pointerdown","wheel","keydown"].forEach(e=>addEventListener(e,endJump,{passive:true}));

/* ---------- Today tab ---------- */
function nextItem(n){const now=n.h*60+n.min;
 for(let k=0;k<12;k++){const day=addDays(n.iso,k);if(day>"2026-12-05")break;if(!CITY_OF[day])continue;const row=ITIN.find(r=>r[0]===lab(day));if(!row)continue;
  const en=row[1].split(" · "),tx=t(row[1]).split(" · "),segs=tx.length===en.length?tx:en,items=[];
  en.forEach((s,i)=>{const re=/(\d{1,2}):(\d{2}) (am|pm)/g;let m;while((m=re.exec(s))){const dubai=/\(lands $/.test(s.slice(0,m.index))&&/Dubai/.test(s);items.push({min:(+m[1]%12+(m[3]==="pm"?12:0))*60+ +m[2]-(dubai?60:0),seg:i,dubai})}});
  items.sort((a,b)=>a.min-b.min);
  for(const it of items){const left=k*1440+it.min-now;if(left>0)return{...it,k,day,left,text:segs[it.seg]}}}
 return null}
function todayCard(n){
 if(n.iso>"2026-12-06")return"";
 if(n.iso<START){const days=dayDiff(n.iso,"2026-11-24"),x=daily("mak",START);
  const head=days>1?fmt("Trip starts in {n} days",{n:days}):days===1?t("Trip starts tomorrow"):t("You fly tonight");
  return `<div class="card"><div class="head"><span class="step">${esc(head)}</span></div><p class="en" style="display:block">${esc(t("Forecast for arrival day"))} · Makkah · ${esc(dd("25 Nov"))}</p>
  ${x?`<div class="wxnow">${IC[kind(x.code)]}<div class="t">${x.max}°</div><div class="wxm"><b>${esc(cond(x.code))}</b><span>${esc(fmt("H {a}° · L {b}°",{a:x.max,b:x.min}))}${x.rain>=30?` · <span class="rain">${esc(fmt("Rain {n}%",{n:x.rain}))}</span>`:""}</span></div></div>${updLine()}`:noWx()}</div>`}
 const c=cityAt(n.iso,n.h);if(!c)return"";
 const x=daily(c,n.iso),hr=hourly(c,n.iso,n.h);
 const head=`${t("Today")} · ${DOW[lang][n.dow]} ${dd(lab(n.iso))} · ${CITIES[c].n}`;
 if(!x&&!hr)return `<div class="card"><div class="head"><span class="step">${esc(head)}</span></div>${noWx()}</div>`;
 const code=hr?hr.code:x.code,slots=[6,9,12,15,18,21].map(h=>({h,v:hourly(c,n.iso,h)}));
 let strip="",hints=[];
 if(slots.every(s=>s.v)){const top=Math.max(...slots.map(s=>s.v.temp));
  strip=`<div class="hours">${slots.map(s=>`<div class="${s.v.temp>=top-1?"hot":""}${n.h>=s.h&&n.h<s.h+3?" cur":""}">${hOnly(s.h).replace(" ","&nbsp;")}${IC[kind(s.v.code)]}<b>${s.v.temp}°</b></div>`).join("")}</div>`;
  const hrs=[];for(let h=6;h<=21;h++){const v=hourly(c,n.iso,h);if(v)hrs.push({h,v:v.temp})}
  const peak=Math.max(...hrs.map(o=>o.v)),hot=hrs.filter(o=>o.v>=peak-1);
  if(hot.length&&n.h<=hot[hot.length-1].h&&peak>=30)hints.push(fmt("Hottest {a}–{b}. Do tawaf outside those hours if you can.",{a:hOnly(hot[0].h),b:hOnly(hot[hot.length-1].h+1)}))}
 if(x&&x.rain>=30)hints.push(fmt("Rain chance {n}%. Wet marble is slippery.",{n:x.rain}));
 return `<div class="card"><div class="head"><span class="step">${esc(head)}</span></div>
 <div class="wxnow">${IC[kind(code)]}${hr?`<div class="t">${hr.temp}°</div>`:""}<div class="wxm"><b>${esc(cond(code))}</b>${hr?`<span>${esc(fmt("Feels {n}°",{n:hr.feel}))}</span>`:""}${x?`<span>${esc(fmt("H {a}° · L {b}°",{a:x.max,b:x.min}))}</span>`:""}</div></div>
 ${strip}${hints.length?`<ul class="hints">${hints.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}${updLine()}</div>`}
function nextCard(n){if(n.iso<START||n.iso>"2026-12-05")return"";const it=nextItem(n);if(!it)return"";
 const h=Math.floor(it.left/60),m=it.left%60,when=it.k>1?dd(lab(it.day)):it.k===1?t("Tomorrow"):h?fmt("in {h} h {m} m",{h,m}):fmt("in {m} min",{m});

 <p class="upd">${esc(t("Umm al-Qura method, worked out on this phone. Follow the masjid's adhan."))}</p></div>`}
function tipsCard(n){if(!WX||n.iso>"2026-12-05")return"";const from=n.iso<START?START:n.iso,days=Object.keys(CITY_OF).filter(d=>d>=from),tips=[];
 let cold=null,hot=null;const wet=[];
 for(const d of days){const dc=dayCity(d),nc=nightCity(d),x=daily(dc,d),y=daily(nc,d);

// Saudi Quran TV runs a 24/7 camera on the Haram. YouTube refreshes the live thumbnail about every 5 minutes.
// A query string makes ytimg return 404, so a fresh copy comes from rotating its image hosts (each one caches for 5 min).
const LIVE_CH="UCos52azQNBgW63_9uDJoPDA",LIVE_VID="IsJTAdC3-Jw";
const LIVE_WATCH="https://www.youtube.com/channel/"+LIVE_CH+"/live";

// The service worker says whether the frame on screen is fresh or the saved copy (offline, or wifi with no internet).

if("serviceWorker"in navigator)navigator.serviceWorker.addEventListener("message",e=>{const m=e.data;if(!m||m.type!=="frame")return;
 frameSaved=m.live?null:m.at;const b=document.getElementById("snap-age");if(b)b.textContent=frameBadge()});
const frameBadge=()=>frameSaved!=null||navigator.onLine===false?fmt("Offline · saved {h}",{h:frameAt()}):t("Every 5 min");
const frameAt=()=>{const v=frameSaved||store.get("frame-at",0);if(!v)return t("earlier");const d=new Date(v+3*3600e3),m=d.getUTCHours()*60+d.getUTCMinutes();return(d.toISOString().slice(0,10)===mNow().iso?"":dd(lab(d.toISOString().slice(0,10)))+" ")+hm(m)};
// Usual mataf (ground floor) busyness for each hour with no prayer nearby. 0 = empty, 100 = packed.
const CROWD_BASE=[50,42,38,42,55,50,45,40,35,30,30,35,40,40,40,45,50,55,60,60,60,55,55,55];
function crowdScore(day,min){const P=prayTimes(day,CITIES.mak),dow=new Date(day+"T00:00Z").getUTCDay(),h=Math.floor(min/60)%24;
 let s=CROWD_BASE[h];
 // People arrive before each prayer and leave after it, so each one adds a bump, wider on the arrival side.
 const bump=(p,amp,pre,post)=>{const x=(min-p)/(min<p?pre:post);return amp*Math.exp(-x*x/2)};
 const fri=dow===5;
 s+=bump(P[0],35,35,30)+bump(P[2],fri?60:25,fri?90:35,fri?40:25)+bump(P[3],25,35,25)+bump(P[4],40,45,30)+bump(P[5],30,30,45);
 if(dow===4&&min>=P[3])s+=12;      // Thursday evening: the start of the Saudi weekend
 if(fri)s+=10;                       // Friday, all day
 if(dow===6&&min<P[0])s+=5;          // Friday night runs past midnight
 return Math.max(5,Math.min(100,Math.round(s)))}
const crowdLevel=s=>s<40?"Quieter":s<60?"Moderate":s<80?"Busy":"Very busy";
function crowdHours(day){return Array.from({length:24},(_,h)=>Math.round([0,15,30,45].reduce((a,m)=>a+crowdScore(day,h*60+m),0)/4))}
// Quieter windows: runs of 30-min slots under 40, at least an hour long, skipping the minutes around each prayer (tawaf stops).
function crowdWindows(day,from){const P=prayTimes(day,CITIES.mak),ok=m=>m>=from&&crowdScore(day,m+15)<40&&!P.some((p,i)=>i!==1&&m+30>p-20&&m<p+20);
 const out=[];let st=null;for(let m=0;m<=1440;m+=30){if(m<1440&&ok(m)){if(st===null)st=m}else if(st!==null){if(m-st>=60)out.push([st,m]);st=null}}
 return out}
function crowdDays(n){const ds=Object.keys(CITY_OF).filter(d=>d>n.iso&&CITY_OF[d]==="mak");if(!(n.iso>="2026-12-02"&&n.iso<="2026-12-05"))ds.unshift(n.iso);return ds.slice(0,6)}
function renderCrowd(){const n=mNow(),days=crowdDays(n),off=navigator.onLine===false;if(off)crowdPlay=false;
 if(!crowdDay||!days.includes(crowdDay))crowdDay=days.includes(n.iso)?n.iso:days[0]||n.iso;
 const day=crowdDay,isToday=day===n.iso,nowMin=n.h*60+n.min,hrs=crowdHours(day),P=prayTimes(day,CITIES.mak);
 const sNow=crowdScore(n.iso,nowMin),win=crowdWindows(day,isToday?nowMin-nowMin%30:0),nextWin=isToday?win[0]:null;
 const dlab=d=>(d===n.iso?t("Today"):DOW[lang][new Date(d+"T00:00Z").getUTCDay()])+" "+dd(lab(d));
 const quiet=new Set();for(const[a,b]of crowdWindows(day,0))for(let h=Math.floor(a/60);h*60<b;h++)quiet.add(h);
 const sel=crowdSel!=null?crowdSel:(isToday?n.h:null);
 const bucket=Math.floor(Date.now()/3e5)+snapTry;
 const snap=crowdPlay?`<iframe src="https://www.youtube.com/embed/live_stream?channel=${LIVE_CH}&autoplay=1&mute=1&playsinline=1" title="${esc(t("Makkah live"))}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
  :`<img id="snap" alt="${esc(t("Latest frame from the Makkah live camera"))}" src="https://${["i","i1","i2","i3","i4"][bucket%5]}.ytimg.com/vi/${LIVE_VID}/maxresdefault_live.jpg"><div class="msg" id="snap-msg" hidden></div>`;
 return `<p class="lead">${esc(t("The live camera shows the Haram right now. The estimate below uses today's prayer times, the weekday and the hour, so you can plan ahead. Times are Makkah time."))}</p>
 <div class="card"><div class="head"><span class="step">${esc(t("Live now"))}</span><span class="bd" id="snap-age">${esc(frameBadge())}</span></div>
  <div class="snap">${snap}</div>
  <div class="row" style="justify-content:flex-start">${crowdPlay||off?"":`<button data-snap="1">${esc(t("Refresh"))}</button><button data-play="1">${esc(t("Play live here"))}</button>`}<a class="plink" href="${LIVE_WATCH}" target="_blank" rel="noopener">${esc(t("Open in YouTube"))}</a></div>
  <p class="note">${esc(t("How to read it: look at the white floor around the Kaaba. Plenty of floor showing means you can walk freely; if the crowd reaches the arcades with no floor in between, it's packed. The camera switches angles, so wait for a wide shot of the mataf."))}</p>
  <p class="en" style="display:block">${fmtE("Official live levels for tawaf and sa'i (green, orange, red) are in the {a}.",{a:`<a class="plink" href="https://www.nusuk.sa/" target="_blank" rel="noopener">${esc(t("Nusuk app"))}</a>`})}</p></div>
 ${n.iso>="2026-12-02"&&n.iso<="2026-12-05"?"":`<div class="card counter"><span class="step">${esc(fmt("Estimate now · {h}",{h:hm(nowMin)}))}</span><div class="big" style="font-size:1.8em">${esc(t(crowdLevel(sNow)))}</div>
  <div class="where">${nextWin?(nextWin[0]<=nowMin?esc(fmt("Good window now, until {b}",{b:hm(nextWin[1])})):esc(fmt("Next quieter window: {a}–{b}",{a:hm(nextWin[0]),b:hm(nextWin[1])}))):isToday?esc(t("No quieter window left today")):""}</div></div>`}
 <div class="card"><span class="step">${esc(t("Forecast by hour"))}</span>
  <div class="dpills">${days.map(d=>`<button data-cday="${d}" aria-pressed="${d===day}">${esc(dlab(d))}</button>`).join("")}</div>
  <div class="bars" role="group" aria-label="${esc(t("Expected crowd by hour"))}">${hrs.map((s,h)=>`<button data-slot="${h}" class="${quiet.has(h)?"q":""}${isToday&&h===n.h?" cur":""}${h===sel?" sel":""}" aria-label="${esc(hOnly(h)+": "+t(crowdLevel(s)))}" title="${esc(hOnly(h)+": "+t(crowdLevel(s)))}"><i style="height:${s}%"></i></button>`).join("")}</div>
  <div class="axis"><span>${hOnly(0)}</span><span>${hOnly(6)}</span><span>${hOnly(12)}</span><span>${hOnly(18)}</span></div>
  <p class="upd" id="slot-read">${sel!=null?esc(fmt("{h}: {l}",{h:hOnly(sel),l:t(crowdLevel(hrs[sel]))}))+" · ":""}${esc(t("Green bars: quieter windows. Tap a bar for the hour."))}</p>
  <span class="step" style="margin-top:6px">${esc(t("Best times for tawaf"))} · ${esc(dlab(day))}</span>
  ${win.length?`<ol class="steps">${win.slice(0,4).map(([a,b])=>`<li>${hm(a)} – ${hm(b)}</li>`).join("")}</ol>`:(()=>{let best=-1;for(let h=isToday?n.h:0;h<24;h++)if(!P.some((p,i)=>i!==1&&h*60+60>p-30&&h*60<p+30)&&(best<0||hrs[h]<hrs[best]))best=h;
   return `<p class="en" style="display:block">${best<0?esc(t("No clearly quiet window. Try the upper floors.")):esc(fmt("No clearly quiet window. Least busy: {a}–{b}, or try the upper floors.",{a:hm(best*60),b:hm(best*60+60)}))}</p>`})()}
  <p class="upd">${esc(fmt("Prayer times that day: Fajr {f} · Dhuhr {d} · Asr {a} · Maghrib {m} · Isha {i}",{f:hm(P[0]),d:hm(P[2]),a:hm(P[3]),m:hm(P[4]),i:hm(P[5])}))}</p>
  <p class="note">${esc(t("This is an estimate from usual patterns, not a measurement. Crowds peak from about 45 min before each prayer until 30 min after, Friday (Jumaat) is the busiest day and Thursday night is busy too. Check the live camera before you go down."))}</p></div>
 <div class="card"><span class="step">${esc(t("Quieter options"))}</span><p class="en" style="display:block">${esc(t("Quieter options: the upper floors (longer rounds, much less crush) or the outer rings. For sa'i, the upper floors are usually quieter too."))}</p></div>`}
